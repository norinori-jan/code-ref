<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="code-ref">
<title>code-ref｜コードの型の引き出し</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0f1720;--card:#17212d;--line:#26344a;--tx:#e8eef6;--mu:#8fa3ba;--ac:#ffd166;--ok:#7bd88f;--ng:#ff8a80;--bl:#4fd1c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
body{padding:calc(12px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:16px 0 6px}
.sub{color:var(--mu);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0}
.card.open{border-color:var(--ac)}
.hd{cursor:pointer}.hd b{font-size:15.5px}
.when{color:var(--mu);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);margin-right:6px;vertical-align:1px}
.tag.mine{color:var(--bl);border-color:var(--bl)}.tag.lv{color:var(--ac);border-color:var(--ac)}
h2{font-size:15px;margin:16px 0 4px}
.one{font-size:14.5px;font-weight:600;margin:8px 0 2px}
.syn{display:flex;gap:14px;font-size:13px;margin:6px 0;color:var(--mu)}.syn code{background:#0a1017;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:15px;color:var(--tx)}
textarea.cd{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:150px;white-space:pre;overflow:auto}
.cv{background:#0a1017;border:1px solid var(--line);border-radius:10px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,monospace;margin:8px 0;max-height:60vh}
.cl{display:flex;white-space:pre}.cl i{flex:0 0 38px;text-align:right;padding-right:8px;color:#5f7184;font-style:normal;user-select:none}.cl span{padding-right:12px}
.cl.in{background:#1a2b3c}.cl.st{background:#23405a;box-shadow:inset 3px 0 0 var(--ac)}.cl.en{background:#23405a;box-shadow:inset 3px 0 0 #ff7a7a}
.tr{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:8px;padding:6px 6px;min-height:36px;font-weight:500;font-size:13.5px}
.tr.on{background:#1a2b3c}.tr .kd{flex:0 0 auto;font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}
.tr .rg{color:var(--mu);font-size:12px;flex:0 0 auto}.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}.flow span.ar{color:var(--mu)}
dl.fl{margin:8px 0}dl.fl dt{font-size:12px;color:var(--ac);font-weight:700;margin-top:8px}dl.fl dd{margin:2px 0 0}dl.fl ul{margin:2px 0 2px 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;background:var(--ac);color:#241a00;border:0;border-radius:10px;padding:9px 13px;font-weight:700;min-height:44px}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}
button.s{min-height:36px;padding:4px 11px;font-size:13px}
input,textarea,select{font:inherit;font-size:16px;width:100%;background:#0c131b;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin:0 -16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:#0c131b;color:var(--mu);border:1px solid var(--line);border-radius:99px;padding:5px 13px;min-height:34px;font-size:13px;font-weight:500}
.chip.on{background:var(--ac);color:#241a00;border-color:var(--ac);font-weight:700}
ul{margin:8px 0 8px 18px;padding:0}li{margin:3px 0}
pre{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12px;line-height:1.5;margin:8px 0;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.ask{border-left:3px solid var(--bl);background:#14202a;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:13.5px}
.ask b{color:var(--bl);font-size:12px;display:block}
.note{color:var(--mu);font-size:12.5px;margin:4px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c131bee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;min-width:0;background:transparent;color:var(--mu);font-size:11px;font-weight:600;padding:5px 2px;min-height:48px;border-radius:8px;position:relative}
.nav button b{display:block;font-size:20px;line-height:1.1}.nav button.on{color:var(--ac)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--ng);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#e8eef6;color:#0f1720;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
label.chk{display:flex;gap:9px;align-items:flex-start;margin:6px 0;font-size:14px}
label.chk input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0}
a{color:var(--bl)}
[hidden]{display:none!important}
</style>
</head>

<nav class="nav" id="nav"></nav>

<script>
"use strict";
const DATA={"doms": [["map", "どこに何が"], ["fn", "関数を制する"], ["ps", "PowerShell"], ["mac", "Mac"], ["gh", "GitHub"], ["cf", "Cloudflare"], ["html", "HTMLの読み方"], ["adv", "応用編"], ["base", "基本設計"], ["data", "保存・データ"], ["ai", "AI連携"], ["voice", "音声・語学"], ["table", "表・会計"], ["sec", "暗号・安全"], ["ship", "配布・Git"], ["ui", "見た目・iPhone"], ["music", "音楽"], ["sym", "記号"], ["file", "ファイルの役割"], ["fail", "失敗例"]], "cards": [{"id": "b1", "dom": "base", "t": "1ファイルのPWAにする", "when": "iPhoneのホーム画面に置いて使うアプリを、ビルド無しで作りたい", "do": ["index.html（見た目も動きも全部）＋ manifest.webmanifest ＋ icon.svg ＋ sw.js の4点にする", "外部ライブラリ・ビルド手順は使わない（壊れにくく、GitHub Pagesにそのまま置ける）", "manifest の start_url と scope は \"./\"（フォルダ公開でも動く）", "iPhoneのホーム画面アイコンはPNGが確実。SVGだと反映されない場合がある"], "ask": "HTML1ファイル＋manifest.webmanifest＋icon.svg＋sw.jsの4ファイルで、ホーム画面に追加して動くPWAにする。外部ライブラリとビルド手順は使わない。", "code": "<!-- index.html の <head> -->\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" href=\"icon.svg\" type=\"image/svg+xml\">\n\n// manifest.webmanifest\n{\"name\":\"my-app\",\"short_name\":\"my-app\",\"start_url\":\"./\",\"scope\":\"./\",\"display\":\"standalone\",\n \"background_color\":\"#0f1720\",\"theme_color\":\"#0f1720\",\n \"icons\":[{\"src\":\"icon.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\",\"purpose\":\"any\"}]}", "tags": "pwa 構成 manifest ホーム画面", "note": ""}, {"id": "b2", "dom": "base", "t": "更新がすぐ届くService Worker", "when": "アプリを更新したのに、iPhoneで古い画面のまま", "do": ["HTMLは「ネット優先、圏外のときだけキャッシュ」にする（更新がすぐ届く）", "同じ公開元のGETだけを扱い、AIや同期の通信（外部・POST）には触らない", "それでも古い時は、ホーム画面のアイコンを削除して入れ直す", "更新が反映されない時の第一容疑者はService Worker"], "ask": "Service Workerは、HTMLをネット優先・失敗時だけキャッシュにする。外部通信とPOSTには触らない。", "code": "// sw.js\nconst C='app-shell-v1';\nself.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(['./','index.html','manifest.webmanifest','icon.svg']).catch(()=>{})))});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});\nself.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET'||new URL(r.url).origin!==location.origin)return;\n  e.respondWith(fetch(r).then(res=>{if(res&&res.ok){const cp=res.clone();caches.open(C).then(c=>c.put(r,cp))}return res}).catch(()=>caches.match(r,{ignoreSearch:true})))});\n\n// index.html 側の登録\nif('serviceWorker' in navigator&&location.protocol.startsWith('http'))\n  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));", "tags": "sw キャッシュ 更新 オフライン", "note": ""}, {"id": "b3", "dom": "base", "t": "アプリ間でデータを渡す（共有リンク）", "when": "あるアプリで作ったものを、別のアプリ・別の端末へ渡したい", "do": ["URLの # 以降（ハッシュ）にデータを入れて渡す。サーバー不要", "日本語が壊れないよう、UTF-8を通してBase64にする", "長すぎるURLは途切れるので、数KBまで。大きい時はファイル書き出しにする"], "ask": "別アプリへ渡すデータは、URLのハッシュ（#import=Base64）で受け渡す。日本語が壊れないようUTF-8でエンコードする。", "code": "const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));\nconst dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));\n// 送る側\nconst url=location.origin+'/lead-sheet/#import='+enc(data);\n// 受ける側（起動時に1回）\nconst m=location.hash.match(/import=([^&]+)/);\nif(m){try{data=dec(m[1])}catch(e){alert('読み込めませんでした')}}", "tags": "共有 リンク 受け渡し ハッシュ", "note": "実例：lead-sheet の共有リンク #import=…"}, {"id": "b4", "dom": "base", "t": "保存キーの決め方", "when": "新しいアプリの保存データを設計するとき", "do": ["キーは「アプリ接頭辞_名前_v1」（例 tp_tables_v1 / cryptovault_real_items）", "後ろに版（_v1）を付ける。形式を変えたら _v2 を作り、読み込み時に移行する", "他のアプリのキーには触らない（同じ公開元は1つの保存箱を共有している）", "同期用の設定は endpoint と token をアプリ接頭辞で分ける"], "ask": "保存キーは「アプリ接頭辞_名前_v1」の形にする。形式を変える時は版を上げて、読み込み時に旧データを移行する。他アプリのキーには触らない。", "code": "", "tags": "キー 命名 版 v1 移行", "note": "", "lv": 2}, {"id": "d1", "dom": "data", "t": "安全に保存する（失敗しても落ちない）", "when": "localStorageに保存したい。いっぱいの時や使えない時も壊れないように", "do": ["読み書きは必ず try/catch で包む（プライベートブラウズ・容量超過で例外になる）", "保存に失敗したら true/false で返し、画面で知らせる（黙って失敗させない）", "大事なデータは書き出し（バックアップ）の導線も用意する"], "ask": "localStorageの読み書きはtry/catchで包み、保存失敗は画面で知らせる。失敗しても画面は動き続ける。", "code": "const store={\n  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},\n  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}\n};\nif(!store.set('app_data_v1',data)) alert('保存できませんでした（容量いっぱいの可能性）。書き出してバックアップしてください');", "tags": "localStorage 保存 容量 try catch", "note": "", "lv": 2}, {"id": "d2", "dom": "data", "t": "容量はアプリ全部で約5MB共有", "when": "「アプリを増やして大丈夫？保存がいっぱいにならない？」", "do": ["同じ公開元（norinori-jan.github.io）のアプリは、localStorageの約5MBを分け合う", "ホーム画面アプリとSafariのタブは、保存場所が別", "大きいデータ（画像・長い履歴・表）はIndexedDBへ。容量がずっと大きい", "storage-check アプリで、実際の使用量とアプリ別の内訳を測れる"], "ask": "保存が増えるデータはIndexedDBに置く。localStorageは設定や小さな状態だけにする。", "code": "", "tags": "容量 5MB quota storage-check", "note": "実例：storage-check"}, {"id": "d3", "dom": "data", "t": "IndexedDBを最小で使う", "when": "画像や大量の行など、localStorageに入らないデータを保存したい", "do": ["キーと値を入れるだけの小さな箱（1つのストア）で十分なことが多い", "操作は Promise に包むと、普通の関数のように使える", "書き込みは transaction が complete してから成功とみなす"], "ask": "大きいデータはIndexedDBに保存する。キー→値の小さなラッパー（get/set/del/keys）を作って使う。", "code": "const db=new Promise((ok,ng)=>{const r=indexedDB.open('app',1);\n  r.onupgradeneeded=()=>r.result.createObjectStore('kv');\n  r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});\nconst tx=async(mode,f)=>{const d=await db;return new Promise((ok,ng)=>{\n  const t=d.transaction('kv',mode);const q=f(t.objectStore('kv'));\n  t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ng(t.error)})};\nconst idb={get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),\n  del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())};\n// 使い方: await idb.set('tables',data); const d=await idb.get('tables');", "tags": "indexeddb 大きい 画像 idb", "note": "実例：quick-ref"}, {"id": "d4", "dom": "data", "t": "書き出し・読み込み（バックアップ）", "when": "データを端末の外に退避したい／別端末へ移したい", "do": ["JSONを Blob にして <a download> でダウンロードさせる", "読み込みは <input type=file> → file.text() → JSON.parse（失敗時は元データを守る）", "読み込み前に「上書きしますか？」を確認する"], "ask": "データのJSON書き出し（ダウンロード）と読み込み（ファイル選択）を付ける。読み込みに失敗しても既存データは壊さない。", "code": "function download(name,text,type='application/json'){\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;\n  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}\n// 書き出し\ndownload('backup.json',JSON.stringify(data,null,2));\n// 読み込み\ninput.onchange=async()=>{try{const d=JSON.parse(await input.files[0].text());\n  if(confirm('今のデータを置き換えますか？')){data=d;save()}}catch(e){alert('読み込めませんでした')}};", "tags": "バックアップ export import ダウンロード", "note": ""}, {"id": "d5", "dom": "data", "t": "ホーム画面とSafariは別の保存場所", "when": "ホーム画面に追加したら、データが空に見える", "do": ["iPhoneのSafariのタブと、ホーム画面のアプリは、保存場所が別々", "切り替える前に、元の側で書き出し（バックアップ）をしておく", "同期（Worker）を設定していれば、同期で取り戻せるアプリもある"], "ask": "書き出し・読み込みの導線を必ず付ける（ホーム画面とSafariで保存場所が別のため）。", "code": "", "tags": "ホーム画面 safari 保存 空", "note": ""}, {"id": "a1", "dom": "ai", "t": "同期Worker経由でAIを呼ぶ（/ai）", "when": "アプリからAIに文章・会話・添削を作らせたい", "do": ["キーはコードに書かない。Workerのアドレスとトークンを設定欄から入れ、端末内に保存する", "POST {provider, model, maxTokens, prompt} → {text} が返る", "45秒で打ち切る（AbortController）。401は「トークンが違います」と表示", "AI機能は任意。設定が無くてもアプリ本体は動く"], "ask": "AI呼び出しは同期Workerの/ai経由で行う。キーはコードに書かず設定欄から入れる。45秒でタイムアウトし、401と失敗は画面で分かるようにする。AI無しでも本体は動くこと。", "code": "function syncCfg(){const g=k=>{try{return(localStorage.getItem(k)||'').trim()}catch(e){return''}};\n  return{ep:g('myapp_sync_endpoint').replace(/\\/$/,''),tk:g('myapp_sync_token')}}\nasync function askAI(prompt,provider='claude'){\n  const c=syncCfg();if(!c.ep||!c.tk)throw new Error('設定が未入力です');\n  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);\n  try{\n    const r=await fetch(c.ep+'/ai',{method:'POST',signal:ctl.signal,\n      headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.tk},\n      body:JSON.stringify({provider,model:'claude-sonnet-4-6',maxTokens:1500,prompt})});\n    if(r.status===401)throw new Error('トークンが違います');\n    if(!r.ok)throw new Error('AI中継エラー '+r.status);\n    return String((await r.json()).text||'');\n  }finally{clearTimeout(to)}}", "tags": "ai worker 同期 claude gemini", "note": "実例：ear-first / ai-dojo", "lv": 5}, {"id": "a2", "dom": "ai", "t": "AIの返事をJSONで安全に受け取る", "when": "AIに会話・リスト・データを作らせ、画面の部品として使いたい", "do": ["プロンプトに「JSON配列のみを出力。説明やマークダウンは不要」と書き、各要素の項目名も指定する", "返事から ``` を除き、最初の [ から最後の ] までを切り出して JSON.parse する", "項目が足りない要素は捨て、数が少なすぎる時はエラーにする", "失敗時は「もう一度」と言うだけにして、画面を壊さない"], "ask": "AIにはJSON配列のみを返させ、受け取る側で ``` の除去・切り出し・項目検証を行う。形が壊れていたら捨ててエラー表示にする。", "code": "// プロンプトの末尾に\n// 'Output ONLY a JSON array, no markdown, no commentary. Each element: {\"s\":\"A\",\"en\":\"...\",\"jp\":\"...\"}'\nfunction parseAI(t){\n  t=String(t||'').replace(/```(?:json)?/gi,'');\n  const a=t.indexOf('['),b=t.lastIndexOf(']');\n  if(a<0||b<a)throw new Error('JSONが見つかりません');\n  let arr;try{arr=JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('JSONを読み取れません')}\n  const out=arr.filter(x=>x&&typeof x.en==='string'&&x.en.trim());\n  if(out.length<4)throw new Error('少なすぎます（'+out.length+'件）');\n  return out}", "tags": "json パース 会話生成 ハルシネーション", "note": "", "lv": 5}, {"id": "a3", "dom": "ai", "t": "秘密をAIに送らない", "when": "ユーザーの入力をAIに渡す機能を付けるとき", "do": ["送る前に、キー・トークン・長い16進文字列を検出して止める", "保護メモ・パスワード・暗号化したデータは、AIに送る対象から外す", "AIに渡す範囲を画面で見せ、押した時だけ送る（自動送信しない）"], "ask": "AIへ送る前に、キー/トークンらしい文字列を検出して送信を止める。保護メモと暗号化データは送らない。送信は必ずボタン操作で行う。", "code": "const SECRET=/(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|Bearer\\s+[A-Za-z0-9._-]{20,}|[A-Fa-f0-9]{40,}|-----BEGIN)/;\nif(SECRET.test(text))throw new Error('キーやトークンらしい文字列が含まれています。伏せ字にしてから送ってください');", "tags": "秘密 トークン 検出 プライバシー", "note": ""}, {"id": "a4", "dom": "ai", "t": "Workerの受信箱（/inbox）で別アプリから受け取る", "when": "音声メモなど別アプリで作った項目を、表やフローチャートのアプリに取り込みたい", "do": ["Workerの /inbox に POST {text, kind, title, tags} で入れておく（kind は memo/table/flow）", "受け取る側は GET /inbox?kind=table で取得し、保存できたものだけ /inbox/ack {ids} で消す", "取り込み済みの id は覚えておき、同じものを二重に取り込まない", "認証は Bearer トークン（実際のWorkerの方式は要確認）"], "ask": "Workerの/inboxから種類（kind）を指定して取得し、保存に成功した項目だけ/inbox/ackで確認済みにする。同じidは二重に取り込まない。", "code": "async function pullInbox(kind){\n  const c=syncCfg();\n  const r=await fetch(c.ep+'/inbox?kind='+kind,{headers:{Authorization:'Bearer '+c.tk}});\n  if(!r.ok)throw new Error('受信失敗 '+r.status);\n  const d=await r.json();const items=Array.isArray(d)?d:(d.items||[]);\n  const seen=new Set(store.get('app_seen_v1',[])),done=[];\n  for(const it of items){ if(seen.has(it.id)){done.push(it.id);continue}\n    if(saveItem(it)){seen.add(it.id);done.push(it.id)} }   // saveItem=保存成功でtrue\n  store.set('app_seen_v1',[...seen]);\n  if(done.length)await fetch(c.ep+'/inbox/ack',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.tk},body:JSON.stringify({ids:done})});\n  return done.length}", "tags": "inbox 受信 voice-pad 連携", "note": "実例：table-pad の受信取り込み", "lv": 5}, {"id": "v1", "dom": "voice", "t": "読み上げ（音声合成）", "when": "英語や日本語の文章を、アプリが声で読み上げてほしい", "do": ["speechSynthesis を使う。新しく読む前に cancel() して重ならないようにする", "声の一覧は遅れて読み込まれる（voiceschanged）。言語が合う声を選ぶ", "iPhoneは、最初の読み上げをボタンのタップ内で呼ばないと鳴らないことがある", "速度は0.8〜0.95で聞き取りやすい（学習用）"], "ask": "読み上げはspeechSynthesisで行う。再生前にcancel()し、言語に合う声を選ぶ。最初の再生は必ずボタンのタップ内で呼ぶ。", "code": "function speak(text,lang='en-US',rate=0.9){\n  speechSynthesis.cancel();\n  const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;\n  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith(lang.slice(0,2)));\n  if(v)u.voice=v;\n  speechSynthesis.speak(u)}\n// <button onclick=\"speak('How are you?')\">▶<\/button>  ← タップの中で呼ぶ", "tags": "tts 読み上げ speechSynthesis 英語", "note": "実例：ear-first / speak-native"}, {"id": "v2", "dom": "voice", "t": "音声入力（聞き取り）", "when": "声で話した内容をテキストにしたい／発音練習の判定に使いたい", "do": ["SpeechRecognition は iPhone では webkit 付きの名前。両方を見る", "使えない端末では、キーボードのマイク（音声入力）を案内する", "1回ごとに start() し、結果は results[0][0].transcript", "認識結果は間違うことがある。そのまま「正解」と判定しない"], "ask": "音声入力はSpeechRecognition／webkitSpeechRecognitionを使う。使えない端末ではキーボードのマイクを案内する。認識結果は修正できるようにする。", "code": "const SR=window.SpeechRecognition||window.webkitSpeechRecognition;\nfunction listen(lang,onText,onEnd){\n  if(!SR){alert('この端末では音声入力が使えません。キーボードのマイクを使ってください');return}\n  const r=new SR();r.lang=lang;r.interimResults=false;r.maxAlternatives=1;\n  r.onresult=e=>onText(e.results[0][0].transcript);\n  r.onend=()=>onEnd&&onEnd();r.onerror=e=>onEnd&&onEnd(e.error);\n  r.start();return r}", "tags": "stt 音声入力 発音 SpeechRecognition", "note": ""}, {"id": "v3", "dom": "voice", "t": "聞いてから話す練習の流れ", "when": "語学で、いきなり話さず耳を慣らしてから練習させたい", "do": ["①例題の会話を先に聞く（全文を通して）→ ②1文ずつ聞いて真似る → ③自分で言う", "例題は難易度（やさしい/ふつう/むずかしい）と場面で分ける", "AIに会話を作らせ、JSONで受け取って同じ画面で使えるようにする", "日本語訳は「見る/隠す」を切り替えられるようにする"], "ask": "語学練習は、①例題を通して聞く②1文ずつ聞いて真似る③自分で言う、の順にする。会話はAIで生成でき、日本語訳は表示/非表示を切り替えられる。", "code": "", "tags": "英語 リスニング シャドーイング", "note": "実例：ear-first"}, {"id": "t1", "dom": "table", "t": "CSVを取り込む（文字コードの罠）", "when": "会計ソフトや銀行のCSVを、アプリに取り込みたい", "do": ["日本のCSVは Shift_JIS が多い。まず UTF-8 として厳密に読み、失敗したら Shift_JIS で読み直す", "先頭のBOM（\\uFEFF）は取り除く", "区切りは行頭を見て、タブ・カンマ・セミコロンから自動判定する", "取り込み前に先頭数行をプレビューし、列名の対応を確認させる"], "ask": "CSV取り込みは、UTF-8で厳密に読んで失敗したらShift_JISで読み直す。区切りは自動判定し、取り込み前にプレビューで列を確認させる。", "code": "function decodeBuf(buf){\n  const u=new Uint8Array(buf);\n  try{return new TextDecoder('utf-8',{fatal:true}).decode(u).replace(/^﻿/,'')}\n  catch(e){return new TextDecoder('shift_jis').decode(u)}}\nfunction delim(t){const l=t.split(/\\r?\\n/)[0]||'';\n  return [['\\t',l.split('\\t').length],[',',l.split(',').length],[';',l.split(';').length]].sort((a,b)=>b[1]-a[1])[0][0]}\n// <input type=file> → text=decodeBuf(await file.arrayBuffer())", "tags": "csv shift_jis 文字コード 取り込み 会計", "note": "実例：table-pad"}, {"id": "t2", "dom": "table", "t": "会計の数字と日付を読み取る", "when": "△1,200 や (500)、「令和7年4月1日」のような表記を数字・日付にしたい", "do": ["全角→半角（NFKC）にしてから処理する", "△ ▲ ( ) - はすべてマイナス。カンマ・円記号・空白は除く", "和暦は元号の基準年を足して西暦にする（令和1年=2019、平成1年=1989、昭和1年=1926）", "読めない値は null にして、画面で「読めない行」として見せる"], "ask": "金額は△▲()をマイナス、カンマ・円記号を除去して数値化する。和暦の日付は西暦に直す。読み取れない値はnullにして一覧で知らせる。", "code": "function num(s){\n  s=String(s).normalize('NFKC').trim().replace(/[,\\s円¥]/g,'');let neg=false;\n  if(/^[△▲]/.test(s)){neg=true;s=s.slice(1)}\n  if(/^\\(.*\\)$/.test(s)){neg=true;s=s.slice(1,-1)}\n  if(/^-/.test(s)){neg=true;s=s.slice(1)}\n  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n)}\nconst ERA={令和:2018,平成:1988,昭和:1925};\nfunction wareki(s){const m=String(s).normalize('NFKC').match(/(令和|平成|昭和)(\\d+|元)年(\\d+)月(\\d+)日/);\n  if(!m)return null;const y=ERA[m[1]]+(m[2]==='元'?1:+m[2]);\n  return y+'-'+String(m[3]).padStart(2,'0')+'-'+String(m[4]).padStart(2,'0')}", "tags": "金額 マイナス △ 和暦 日付 会計", "note": ""}, {"id": "t3", "dom": "table", "t": "表から最適なグラフを自動で選ぶ", "when": "データを入れたら、グラフをいちいち選ばせず出したい", "do": ["各列の型を判定する：数値／日付／カテゴリ（種類が少ない文字）／文章", "日付＋数値 → 折れ線、カテゴリ＋数値 → 棒、カテゴリの割合 → 円", "候補を数個「おすすめカード」として並べ、ユーザーが消す・足す", "カテゴリが多すぎる列は上位N件＋「その他」にまとめる"], "ask": "列の型（数値/日付/カテゴリ）を判定し、日付+数値は折れ線、カテゴリ+数値は棒、割合は円でおすすめグラフを自動で並べる。ユーザーが追加・削除できる。", "code": "", "tags": "グラフ ダッシュボード 自動 recommend", "note": "実例：table-pad"}, {"id": "t4", "dom": "table", "t": "連動するグラフ（クリックで絞り込み）", "when": "Power BIのように、1つのグラフをタップすると他のグラフも連動して変わってほしい", "do": ["絞り込み条件（列→選んだ値）を1か所に持つ", "どのグラフも、描く前に必ずその条件で行を絞ってから集計する", "同じ値をもう一度タップすると解除。条件は画面上部に見える形で出す", "棒・点・扇に data 属性で値を持たせ、クリックで条件に追加する"], "ask": "グラフ間の連動は、絞り込み条件を1か所に持ち、全グラフがその条件で行を絞ってから集計する方式にする。同じ値のタップで解除でき、条件は上部に表示する。", "code": "const xf={};                       // {列名: 選んだ値}\nconst rows=()=>all.filter(r=>Object.entries(xf).every(([c,v])=>r[c]===v));\nfunction pick(col,val){xf[col]===val?delete xf[col]:xf[col]=val;redrawAll()}\n// 各グラフ: const data=aggregate(rows(),col) で描く。バーのclickで pick(col,label)", "tags": "連動 クロスフィルタ powerbi ダッシュボード", "note": "実例：table-pad のダッシュボード"}, {"id": "t5", "dom": "table", "t": "ライブラリ無しの軽い棒グラフ（SVG）", "when": "外部ライブラリを使わず、グラフを描きたい", "do": ["SVGを文字列で組み立てると、数十行で棒グラフができる", "viewBox を使えば、画面幅に合わせて拡縮する（width=100%）", "ラベルは escape してから埋め込む（ユーザー入力が混ざるため）"], "ask": "グラフは外部ライブラリを使わずSVGで描く。viewBoxで拡縮し、ラベルはエスケープしてから埋め込む。", "code": "const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nfunction bars(data,w=320,h=160){            // data=[[ラベル,値],...]\n  const max=Math.max(...data.map(d=>d[1]),1),bw=w/data.length;\n  return `<svg viewBox=\"0 0 ${w} ${h+20}\" width=\"100%\">`+data.map((d,i)=>{\n    const bh=d[1]/max*h;\n    return `<rect x=\"${i*bw+4}\" y=\"${h-bh}\" width=\"${bw-8}\" height=\"${bh}\" fill=\"#4fd1c5\"/>`\n         +`<text x=\"${i*bw+bw/2}\" y=\"${h+14}\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8fa3ba\">${esc(d[0])}<\/text>`}).join('')+'<\/svg>'}", "tags": "svg グラフ 棒 chart", "note": ""}, {"id": "s1", "dom": "sec", "t": "パスワードで暗号化して保存する", "when": "大事なメモ・パスワードを、端末内でも暗号化して保存したい", "do": ["WebCrypto の AES-GCM（256bit）。鍵は合言葉から PBKDF2（SHA-256・20万回）で作る", "salt（16バイト）は初回に乱数で作って保存（秘密ではない）。iv（12バイト）は毎回新しく作る", "合言葉そのものは保存しない。忘れたら復元できないことを画面で伝える", "暗号化したものは iv と ct（16進文字列）で保存する"], "ask": "暗号化はWebCryptoのAES-GCM。鍵は合言葉からPBKDF2(SHA-256,200000回)で導出し、saltは初回に16バイト乱数で保存、ivは毎回12バイト乱数にする。合言葉は保存しない。", "code": "const te=new TextEncoder(),td=new TextDecoder();\nconst hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');\nconst unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));\nasync function keyFrom(pw,salt){\n  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);\n  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}\nasync function encrypt(key,text){const iv=crypto.getRandomValues(new Uint8Array(12));\n  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text));return{iv:hex(iv),ct:hex(ct)}}\nasync function decrypt(key,o){return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unhex(o.iv)},key,unhex(o.ct)))}", "tags": "aes gcm pbkdf2 暗号 金庫 webcrypto", "note": "実例：crypto-vault / quick-ref"}, {"id": "s2", "dom": "sec", "t": "パスワード漏洩チェック（HIBP）", "when": "使っているパスワードが、過去の漏洩に含まれていないか調べたい", "do": ["パスワード全体は送らない。SHA-1の先頭5文字だけを送り、返ってきた候補を手元で突き合わせる（k匿名性）", "Add-Padding: true を付けると、件数の推測がされにくい", "同じパスワードの使い回し・短さ・単純さも、手元で一緒に検出する", "結果は画面に出すだけ。パスワードをログやAIに流さない"], "ask": "漏洩チェックはHIBPのk-anonymity方式。SHA-1の先頭5文字だけを送り、返却された候補を手元で照合する。パスワード本体は外へ出さない。", "code": "async function sha1hex(t){return hex(await crypto.subtle.digest('SHA-1',te.encode(t))).toUpperCase()}\nasync function pwnedCount(pw){\n  const h=await sha1hex(pw),pre=h.slice(0,5),suf=h.slice(5);\n  const r=await fetch('https://api.pwnedpasswords.com/range/'+pre,{headers:{'Add-Padding':'true'}});\n  const line=(await r.text()).split(/\\r?\\n/).find(l=>l.startsWith(suf));\n  return line?parseInt(line.split(':')[1],10):0}   // 0なら見つからず", "tags": "hibp 漏洩 pwned パスワード チェック", "note": "実例：crypto-vault"}, {"id": "s3", "dom": "sec", "t": "強いパスワードを作る", "when": "新しいパスワードを、アプリ内で安全に作らせたい", "do": ["Math.random は使わず、crypto.getRandomValues を使う", "20文字以上。紛らわしい文字（0 O 1 l I）は除く", "サービスごとに別のパスワードにする（使い回さない）"], "ask": "パスワード生成はcrypto.getRandomValuesで20文字以上。紛らわしい文字は除く。", "code": "function genPw(n=20){\n  const set='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_';\n  const a=new Uint32Array(n);crypto.getRandomValues(a);\n  return [...a].map(x=>set[x%set.length]).join('')}", "tags": "パスワード生成 random", "note": ""}, {"id": "s4", "dom": "sec", "t": "コピーしたパスワードを自動で消す", "when": "パスワードをクリップボードにコピーさせたい", "do": ["コピーの60秒後に、クリップボードを空にする", "コピーしたことを画面で知らせる（秒数も）", "画面にパスワードを出しっぱなしにしない（表示は押している間だけ）"], "ask": "パスワードのコピーは、60秒後にクリップボードを空にする。画面表示は必要な間だけにする。", "code": "async function copySecret(t,ms=60000){\n  await navigator.clipboard.writeText(t);\n  setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),ms)}", "tags": "クリップボード パスワード 自動消去", "note": ""}, {"id": "s5", "dom": "sec", "t": "緊急時の手順をアプリに組み込む", "when": "情報漏洩・乗っ取りが起きた時、すぐ手順どおりに動けるようにしたい", "do": ["順番つきのチェックリスト（8手前後）を、記録つきで持つ。開始日時（since）を保存する", "完了した手順にチェックが残り、途中で閉じても続きから再開できる", "「変更した」の判定は、更新日時 >= 開始日時 で自動にする", "漏洩チェック→危ない順に並べる→1件ずつ新パスワードを生成して変更、の流れにする", "対応の記録（パスワードを含めない）をコピーして、カード会社や相談先へ渡せる"], "ask": "緊急対応の画面を作る。手順を順番のチェックリストにして開始日時を記録し、中断しても再開できる。変更済みの判定は更新日時>=開始日時で自動化する。記録のコピーにパスワードは含めない。", "code": "", "tags": "緊急 インシデント 乗っ取り 漏洩 手順", "note": "実例：crypto-vault の 🚨 緊急"}, {"id": "g1", "dom": "ship", "t": "配布ファイル名＋1回貼りのShip／ShipAll", "when": "作ったアプリのファイルを、迷わずGitHubに公開したい", "do": ["ファイル名は「アプリ名__ファイル名」（例 table-pad__index.html）。同名ファイルが混ざる事故を防ぐ", "同じアプリを同じ日に2回渡す時は、アプリ名の後に -r2、-r3（番号が大きい方が新しい）", "Ship関数が、ダウンロード等から探し、フォルダ・リポジトリを作り、コピー→commit→push→Pages設定まで行う", "ShipAll は、最近3日以内に届いた全アプリを自動で見つけて、順番に全部pushし、最後に結果の一覧を出す（次のカード g6）", "全角や空白に崩れた名前、(1) 付きの名前も拾える作りにする", "既存リポジトリに上書きする時は、そのリポジトリの既存の名前を尊重する"], "ask": "配布ファイルは「アプリ名__ファイル名」で出す。公開用のPowerShellはコピペでそのまま動く1ブロックにし、説明文や空欄を入れない。", "code": "function Nz([string]$s) { ($s.Normalize([Text.NormalizationForm]::FormKC) -replace '[ー―–—−‐]','-' -replace '\\s','').ToLower() }\nfunction ShipSet([string]$n, [string]$s) { if (-not $global:ShipRes) { $global:ShipRes = [ordered]@{} }; $global:ShipRes[$n] = $s }\nfunction Ship {\n  param([string]$name, [string[]]$files)\n  $user = \"norinori-jan\"\n  $dest = Join-Path $env:USERPROFILE $name\n  $roots = @(\"Downloads\",\"iCloudDrive\",\"Desktop\",\"OneDrive\") | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }\n  Write-Host \"=== $name ===\"\n  $pool = foreach ($r in $roots) { Get-ChildItem $r -File -Recurse -Depth 2 -ErrorAction SilentlyContinue }\n  $revPat = '^' + [regex]::Escape((Nz $name)) + '-r(\\d+)'\n  $src = @{}\n  foreach ($f in $files) {\n    $b = [IO.Path]::GetFileNameWithoutExtension($f); $e = [IO.Path]::GetExtension($f)\n    $pat = '^' + [regex]::Escape((Nz $name)) + '(-r\\d+)?_*' + [regex]::Escape((Nz $b)) + '.*' + [regex]::Escape((Nz $e)) + '(\\.txt)?$'\n    $c = $pool | Where-Object { (Nz $_.Name) -match $pat } | Sort-Object @{ Expression = { if ((Nz $_.Name) -match $revPat) { [int]$Matches[1] } else { 0 } }; Descending = $true }, @{ Expression = { $_.LastWriteTime }; Descending = $true } | Select-Object -First 1\n    if (-not $c) {\n      Write-Host \"NG: ${name}__$f が見つかりません\"\n      ShipSet $name \"NG（${f} が見つからない）\"\n      Write-Host \"  探した場所: $($roots -join ', ')\"\n      $near = $pool | Where-Object { (Nz $_.Name).Contains((Nz $name)) } | Select-Object -First 8\n      if ($near) { Write-Host \"  近い名前のファイル:\"; $near | ForEach-Object { Write-Host \"    $($_.FullName)\" } } else { Write-Host \"  名前に $name を含むファイルが1つもありません\" }\n      return\n    }\n    Write-Host \"  見つけた: $($c.FullName)\"\n    $src[$f] = $c\n  }\n  gh repo view \"$user/$name\" *> $null\n  $exists = ($LASTEXITCODE -eq 0)\n  New-Item -ItemType Directory -Force -Path $dest | Out-Null\n  Set-Location $dest\n  if (-not (Test-Path \".git\")) {\n    git init\n    git branch -M main\n    if ($exists) { git remote add origin \"https://github.com/$user/$name.git\"; git fetch origin; git reset origin/main; git checkout -- . }\n  } elseif ($exists) { git pull --rebase }\n  foreach ($f in $files) { Copy-Item $src[$f].FullName (Join-Path $dest $f) -Force }\n  git add @files\n  git diff --cached --quiet\n  if ($LASTEXITCODE -eq 0) { Write-Host \"$name : 変更なし（すでに反映済み）\"; ShipSet $name \"変更なし\"; return }\n  git commit -m \"update $name\"\n  if (-not $exists) { gh repo create \"$user/$name\" --public --source . --remote origin }\n  $br = (git rev-parse --abbrev-ref HEAD).Trim()\n  git push -u origin $br\n  if ($LASTEXITCODE -ne 0) { Write-Host \"NG: $name の push に失敗しました（ブランチ: $br）\"; ShipSet $name \"NG（pushに失敗）\"; return }\n  gh api \"repos/$user/$name/pages\" *> $null\n  if ($LASTEXITCODE -ne 0) { gh api -X POST \"repos/$user/$name/pages\" -f \"source[branch]=$br\" -f \"source[path]=/\" *> $null }\n  Write-Host \"完了: https://$user.github.io/$name/\"\n  ShipSet $name \"完了 https://$user.github.io/$name/\"\n}\n\nfunction ShipAll {\n  param([string[]]$only = @(), [int]$days = 3)\n  $map = @{ index = 'html'; manifest = 'webmanifest'; icon = 'svg'; sw = 'js' }\n  $roots = @(\"Downloads\",\"iCloudDrive\",\"Desktop\",\"OneDrive\") | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }\n  $since = (Get-Date).AddDays(-$days)\n  if ($only.Count -gt 0) { $since = [datetime]::MinValue }\n  $global:ShipRes = [ordered]@{}\n  $rx = '^([a-z0-9][a-z0-9-]*?)(-r\\d+)?[_\\s]+(index|manifest|icon|sw)(\\s*\\(\\d+\\)|\\s+\\d+)?\\.(html|webmanifest|svg|js)(\\.txt)?$'\n  $apps = @{}\n  foreach ($r in $roots) {\n    Get-ChildItem $r -File -Recurse -Depth 2 -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $since } | ForEach-Object {\n      $n = ($_.Name.Normalize([Text.NormalizationForm]::FormKC) -replace '[ー―–—−‐]','-').ToLower()\n      if ($n -match $rx -and $map[$Matches[3]] -eq $Matches[5]) {\n        $app = $Matches[1]; $file = $Matches[3] + '.' + $Matches[5]\n        if (-not $apps.ContainsKey($app)) { $apps[$app] = @() }\n        if ($apps[$app] -notcontains $file) { $apps[$app] += $file }\n      }\n    }\n  }\n  if ($only.Count -gt 0) { $targets = @($only | ForEach-Object { (Nz $_) }) } else { $targets = @($apps.Keys | Sort-Object) }\n  if ($targets.Count -eq 0) { Write-Host \"公開待ちのファイルがありません（最近 $days 日以内に届いた「アプリ名__index.html」の形のもの）\"; return }\n  Write-Host (\"まとめて公開: \" + ($targets -join \", \"))\n  foreach ($a in $targets) {\n    if (-not $apps.ContainsKey($a)) { Write-Host \"=== $a ===\"; Write-Host \"NG: $a のファイルが見つかりません\"; $global:ShipRes[$a] = \"NG（ファイルなし）\"; continue }\n    Ship $a $apps[$a]\n  }\n  Set-Location $env:USERPROFILE\n  Write-Host \"\"\n  Write-Host \"===== 結果 =====\"\n  foreach ($k in $global:ShipRes.Keys) { Write-Host (\"{0,-16} {1}\" -f $k, $global:ShipRes[$k]) }\n}\n\n# 1アプリだけ：\nShip \"my-app\" @(\"index.html\",\"manifest.webmanifest\",\"icon.svg\",\"sw.js\")\n\n# 届いた全アプリをまとめて：\nShipAll", "tags": "ship powershell 配布 push 公開 ファイル名", "note": "実例：ai-dojo の「作る」タブが生成"}, {"id": "g2", "dom": "ship", "t": "公開されない・古いまま（Pagesの確認）", "when": "pushしたのにページが出ない／ビルドが失敗する", "do": ["公開ブランチ名は main でなくてもよい。設定で指定したブランチとフォルダが公開される", "確認する3点：公開ブランチ、フォルダ（/ か /docs）、状態（built か errored）", "「source: ./docs」のログ＋ENOENT → 公開フォルダが /docs なのに docs が無い。フォルダを / に直す", "壊れた .github/workflows の自動処理が残っていると、毎回失敗する。使わないなら外す", "push 直後は反映まで1〜2分。errored なら、直近のビルドのエラー文を読む"], "ask": "公開されない時は、Pagesの公開ブランチ・フォルダ・状態をgh apiで確認する。フォルダが/docsなのに無い、壊れたワークフローが残っている、が典型原因。", "code": "foreach ($r in \"ai-dojo\",\"table-pad\",\"security-hub\") {\n  $j = gh api \"repos/norinori-jan/$r/pages\" 2>$null | ConvertFrom-Json\n  $d = (gh api \"repos/norinori-jan/$r\" --jq '.default_branch' 2>$null)\n  if ($j) { Write-Host (\"{0,-14} 公開={1,-7} 既定={2,-7} フォルダ={3} 状態={4}\" -f $r, $j.source.branch, $d, $j.source.path, $j.status) } else { Write-Host (\"{0,-14} 公開されていません\" -f $r) }\n}\n# フォルダを / に直す\ngh api -X PUT repos/norinori-jan/security-hub/pages -f \"source[branch]=master\" -f \"source[path]=/\"", "tags": "pages 公開 errored docs master main 失敗", "note": "実例：security-hub の errored"}, {"id": "g6", "dom": "ship", "t": "まとめて公開（ShipAll／shipall）", "when": "何個ものアプリを、1回の貼り付けで全部GitHubに公開したい", "do": ["ShipAll は、ダウンロードなどから「アプリ名__index.html」の形のファイルを探し、アプリごとに自動で分けて、全部pushする", "対象は、最近3日以内に届いたファイルだけ。古い版が残っていても、巻き戻して上書きしない安全策", "名前が崩れたもの（全角・空白・(1)・-r2 -r3）も拾い、番号が大きい版を使う", "アプリを指定したい時：ShipAll -only \"ai-dojo\",\"code-ref\"（この時は日数の制限なし）", "日数を変えたい時：ShipAll -days 7", "最後に「完了／変更なし／NG」の一覧が出る。NGの理由は、その上の表示に出ている", "pushは1つずつ順番に行う。同じ場所で同時に動かすとgitが衝突するため。1回の貼り付けで全部終わる"], "ask": "公開コマンドは、届いた全アプリを自動検出して順番にpushするShipAllを使い、最後に結果の一覧を出す。", "code": "ShipAll\n\n# 指定する時\nShipAll -only \"ai-dojo\",\"code-ref\"\n\n# Mac\nshipall\nshipall ai-dojo code-ref", "tags": "shipall まとめて 全部 同時 push 公開 複数 アプリ", "note": "Mac版 shipall も同じ動き（前に ship 関数の貼り付けが必要）"}, {"id": "g3", "dom": "ship", "t": "文字化けを起こさない", "when": "日本語が「縺…」のようなおかしな文字になった", "do": ["ファイルは必ず UTF-8。HTML の先頭付近に <meta charset=\"utf-8\"> を入れる", "PowerShell の .ps1 は、Windows PowerShell 5.1 では UTF-8 の BOM 付きで保存する", "ファイル全体を別の形式で再保存するツールや操作を通さない（壊れたら履歴からは戻せないことがある）", "壊れたら、壊れる前のコミットから作り直す（speak-native は c7721c8 から復元した）"], "ask": "全ファイルUTF-8で出力し、HTMLにはmeta charsetを入れる。PowerShellスクリプトはBOM付きUTF-8にする。", "code": "# BOM付きUTF-8で保存（PowerShell）\n[IO.File]::WriteAllText(\"$env:USERPROFILE\\Downloads\\a.ps1\", $text, (New-Object Text.UTF8Encoding $true))", "tags": "文字化け utf-8 bom mojibake", "note": "実例：speak-native / whitehacker-lab"}, {"id": "g4", "dom": "ship", "t": "よくあるpushの表示の読み方", "when": "git の画面に英語が出て、成功か失敗かわからない", "do": ["nothing to commit → 変更が無いだけ（すでに反映済み）。失敗ではない", "rejected / non-fast-forward → GitHub側が先に進んでいる。先に pull する", "Authentication failed → ログイン切れ。gh auth login をやり直す", "src refspec main does not match any → ブランチ名が違う（master のことがある）。git branch で確認", "「完了」と出ても、前の行にエラーがあれば失敗している"], "ask": "コマンドの出力は、成功と失敗が区別できるように、失敗時は理由と次の手を表示する。", "code": "", "tags": "git push エラー rejected master main", "note": ""}, {"id": "g5", "dom": "ship", "t": "別セッション・古いコピーで上書きしない", "when": "AIに「この部分を直して」と頼んで、前に直した所が消えた", "do": ["直す前に、最新のファイルを渡す（記憶や要約ではなく現物）", "「変えない範囲」を明記する（他の機能・保存形式）", "直した後は、直した所と、前に動いていた主な機能の両方を確認する", "別の端末・別の会話で作ったコピーを、そのまま上書きしない"], "ask": "修正の依頼では、最新のファイルを添付し、変えない範囲を明記する。変更箇所の説明と、全体を1ファイルで返す。", "code": "", "tags": "上書き 修正 デグレ 最新", "note": ""}, {"id": "u1", "dom": "ui", "t": "iPhoneで使いやすい画面のCSS", "when": "指で押しやすく、ノッチや下のバーに隠れない画面にしたい", "do": ["viewport に viewport-fit=cover を付け、余白は env(safe-area-inset-*) で取る", "入力欄の文字は 16px 以上（未満だと入力時に勝手に拡大される）", "ボタンの高さは44px以上。下タブは固定して、下の安全領域ぶん余白を足す", "タップ時の灰色ハイライトは消す"], "ask": "iPhone向けに、safe-areaの余白・入力欄16px以上・ボタン44px以上・下固定タブにする。", "code": "html,body{margin:0;-webkit-text-size-adjust:100%}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{padding:calc(12px + env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}\ninput,t nscribe（POST、音声の文字起こし）、/attachments/アプリ名/id（GET/PUT/DELETE、添付ファイル）", "同期：上の4つで始まらないパスは、すべて同期（GET/PUT）。アプリ名はパスの最後の1区切り（/sync/quick-ref なら quick-ref、パスが空なら flow-mind）。KVのキーはアプリ名そのもの", "同期の動き：GET は保存済みの {timestamp, data} をそのまま返す（無ければ404）。PUT は {data: …} を受け取り、サーバーが時刻を付けて上書き保存し {status:'ok', timestamp} を返す。統合（マージ）はサーバーでなくアプリ側。POST/DELETE は405", "添付ファイル：画像などの生のバイナリで送る（base64にしない）。情報はヘッダー（X-Item-Id、X-Mime-Type、X-File-Name はURLエンコード、X-Updated-At）で運ぶ。KVのキーは attachments:アプリ名:id。サイズ・件数の上限と保存期限は、コードには無い（KVの仕様次第）", "認証：全窓口が冒頭の同じ検査1回で守られ、Authorization: Bearer トークン を env.SECRET_TOKEN || env.AUTH_TOKEN と比べる。SECRET_TOKEN があればそれだけが有効で、AUTH_TOKEN は無い時の代わり（両方が有効にはならない）。OPTIONS だけは認証なしで通る", "AIと音声は、1日の上限（AI_DAILY_LIMIT）を共通で使う。音声は約10MBまで（base64で14MB）", "Secrets：ANTHROPIC_API_KEY、OPENAI_API_KEY、GEMINI_API_KEY、AUTH_TOKEN、SECRET_TOKEN", "注意：同期のキーは接頭辞なしなので、認証を通ると inbox:… や attachments:… のキーも、パスの工夫で読み書きできてしまう。1人で使う間は実害は小さい。気になる時は、同期のキーに接頭辞を付ける修正を頼む", "emotion-bridge-api（Pages）：箱は EMOTION_KV、秘密は BRIDGE_TOKEN。functions/api/emotion の push.js / pull.js が窓口", "crypto-vault の workers：backup-worker.js、multidevice-worker.js（AI中継 /api/v1/ai/{provider} を含む）", "speak-native の worker（worker.js）、video-studio の worker フォルダ（今回の調査では窓口の行なし）", "同じ『AI中継』が複数ある（sync-worker と crypto-vault）。アプリごとに、どのアドレスを設定欄に入れているか確認する"], "ask": "", "code": "", "tags": "worker 一覧 sync-worker emotion-bridge-api inbox ai 窓口 kv 場所", "note": "2026-10-17 に worker.js（デプロイ済みの版）を読んで確認した。PC側を手で書き換えていれば違う可能性がある", "lv": 6}, {"id": "c6", "dom": "cf", "t": "ブラウザからWorkerを呼ぶ時の鍵：CORSと認証", "when": "アプリから呼んだら「Failed to fetch」や 401 が出る", "do": ["別のサイト（github.io）からWorkerを呼ぶには、Worker側が CORS の許可ヘッダーを返す必要がある", "Authorization ヘッダー付きのPOSTは、先に OPTIONS（確認の問い合わせ）が来る。これに答えないと失敗する", "許可するのは自分のサイトだけ（https://norinori-jan.github.io）にする", "トークンは Bearer で受け、違えば 401 を返す。401 の応答にも CORS ヘッダーを付ける（付けないと原因が見えない）", "「Failed to fetch」＝ほぼ CORS かアドレス違い。401＝トークン違い。1101＝Worker内のエラー（コードの例外）"], "ask": "WorkerはCORS（許可するオリジンは自分のgithub.ioのみ）とOPTIONS応答を実装し、Bearerトークンが違えば401をCORSヘッダー付きで返す。", "code": "// Workerのひな形（考え方の例。sync-worker も、冒頭で Bearer を1回検査する同じ作り）\nexport default {\n  async fetch(req, env) {\n    const cors = {\n      'Access-Control-Allow-Origin': 'https://norinori-jan.github.io',\n      'Access-Control-Allow-Headers': 'Content-Type, Authorization',\n      'Access-Control-Allow-Methods': 'GET, POST, OPTIONS'\n    };\n    if (req.method === 'OPTIONS') return new Response(null, { headers: cors });\n    if (req.headers.get('Authorization') !== 'Bearer ' + (env.SECRET_TOKEN || env.AUTH_TOKEN))\n      return new Response('unauthorized', { status: 401, headers: cors });\n    const url = new URL(req.url);\n    if (url.pathname === '/ping') return new Response('ok', { headers: cors });\n    return new Response('not found', { status: 404, headers: cors });\n  }\n};", "tags": "cors 401 failed to fetch options bearer worker", "note": "", "lv": 5}, {"id": "c7", "dom": "cf", "t": "Workerの調子が悪い時の見方", "when": "AIが返ってこない／同期されない／エラーが出る", "do": ["まず、アプリの設定欄のアドレスとトークンを確認（空・違い）", "wrangler tail を起動したまま、アプリで操作する。リクエストとエラーがその場で流れる", "ダッシュボードのログ（Observability／Logs）でも、過去の失敗を見られる", "ブラウザで https://Workerのアドレス/ping のような簡単な窓口を開くと、生きているか確認できる（窓口があれば）", "/ai・/inbox・/transcribe が 503 で止まる時は、Worker にトークン（SECRET_TOKEN か AUTH_TOKEN）が登録されていない。401 は、アプリのトークンが違う", "AIが返ってこない時は、1日の上限（AI_DAILY_LIMIT）に達している可能性もある。AIと音声は上限を共通で使う", "デプロイ直後は、反映に数秒かかる。deploy が成功したかも確認する"], "ask": "", "code": "", "tags": "worker 調子 ログ tail 同期されない ai 返ってこない 上限", "note": ""}, {"id": "m1h", "dom": "html", "t": "HTMLファイルの「4つの部屋」", "when": "index.html を開いたら、長くて何がどこにあるのかわからない", "do": ["head：設定の部屋（文字コード・画面幅・タイトル・manifestへのリンク）", "style：見た目の部屋（色・大きさ・並び方）", "body：画面の部品の部屋（見える文字・ボタン・入力欄）", "script：動きの部屋（ボタンを押したら何をするか・保存・通信）", "私のアプリは1ファイルに4つとも入っている。上から順に、この順番で並んでいる"], "ask": "", "code": "<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>アプリ名<\/title>\n  <style> /* 見た目 */ <\/style>\n<\/head>\n<body>\n  <div id=\"app\"><\/div>      <!-- 画面の部品。多くは script が後から作る -->\n  <script> /* 動き */ <\/script>\n<\/body>\n<\/html>", "tags": "html 構造 head body style script 部屋 読み方", "note": ""}, {"id": "m2h", "dom": "html", "t": "直したい場所の探し方", "when": "「ここを直して」と言いたいが、どこがそのコードかわからない", "do": ["画面に出ている文字（ボタン名・見出し）で、ファイルの中を検索する（PCなら Select-String）", "見た目（色・大きさ）→ style の中。色は :root の変数（--bg など）にまとまっている", "ボタンの動き → 同じボタンの id を、script の中で探す（$('#ad').onclick など）", "保存の処理 → localStorage / store.set / idb.set を探す", "通信 → fetch( を探す", "AIに伝える時は、「『保存』という文字がある部分」のように、画面の文字で場所を指す"], "ask": "「〇〇」という文字を含む画面部分の処理を直す。変更は、その部分に限り、他は変えない。", "code": "Select-String -Path \"$env:USERPROFILE\\ai-dojo\\index.html\" -Pattern \"完了にする\"\nSelect-String -Path \"$env:USERPROFILE\\ai-dojo\\index.html\" -Pattern \"localStorage|store.set|fetch\\(\"", "tags": "探す 場所 直す 検索 どこ 画面の文字", "note": ""}, {"id": "m3h", "dom": "html", "t": "id・class・data- の読み方", "when": "<button id=\"ad\" class=\"g\" data-a=\"cart\"> の意味がわからない", "do": ["id：その部品1つだけの名札。scriptから $('#ad') のように呼ぶ", "class：見た目の仲間分け。複数の部品に付けて、style でまとめて整える", "data-xxx：部品に持たせるメモ。クリックした時に、どの項目かを知るために使う", "onclick／addEventListener：クリックされた時にする動き。ボタンとscriptをつなぐ", "hidden：非表示。画面の出し入れは、これを付けたり外したりして行う"], "ask": "", "code": "<button id=\"ad\" class=\"g\" data-a=\"cart\">追加<\/button>\n\n<script>\ndocument.querySelector('#ad').onclick = () => {   // id で部品をつかむ\n  alert('押されました');\n};\n<\/script>", "tags": "id class data 属性 onclick 読み方 ボタン", "note": ""}, {"id": "m4h", "dom": "html", "t": "JavaScriptの読み方（上から順に）", "when": "scriptの中の記号が多くて、何をしているのか読めない", "do": ["上から順に実行される。function や => は「手順書の登録」で、呼ばれるまで動かない", "const / let：名前付きの入れ物。S（状態）＝今のデータ、render() ＝それを画面にする", "基本の流れ：データ（S）を変える → save() で保存 → render() で画面を作り直す", "async / await：通信など、待つ処理。try/catch は失敗した時の受け皿", "`...${変数}...`：文字の途中に変数を入れる書き方", "わからない所は、その数行をAIに貼って「何をしている？」と聞くのが一番早い"], "ask": "このコードの該当部分を、初心者向けに1行ずつ説明して。何を入れると何が起きるかも示して。", "code": "", "tags": "javascript 読み方 関数 render const async 流れ", "note": "", "lv": 3}, {"id": "m5h", "dom": "html", "t": "私のアプリの標準構造", "when": "新しいアプリを作る時、どんな順番で組み立てればいい？", "do": ["style：:root に色の変数 → 各部品の見た目", "body：#app（画面の中身）と #nav（下のタブ）だけ", "script の順番：設定・定数 → store（保存） → 状態 S → 部品を作る関数 → render() → 起動（render() 呼び出し）", "画面はすべて render() の中で作る（タブごとに r○○() という関数）", "最後に Service Worker の登録（あれば）", "この順番を守ると、他のアプリとも読み方が揃い、AIにも直してもらいやすい"], "ask": "標準構造（styleの色変数→body(#app,#nav)→script(設定→store→状態→画面関数→render→起動)）で作る。", "code": "", "tags": "標準構造 テンプレート 順番 組み立て render", "note": "実例：ai-dojo / code-ref"}, {"id": "x1", "dom": "mac", "t": "Windows と Mac のコマンド対応表", "when": "WindowsのPowerShellで覚えたことを、MacBook Proのターミナルでも使いたい", "do": ["起動：PowerShell（スタートで検索）／ ターミナル（⌘+スペース →「ターミナル」）", "ホームフォルダ：$env:USERPROFILE（C:\\Users\\名前）／ ~ または $HOME（/Users/名前）", "パスの区切り：\\ （バックスラッシュ）／ / （スラッシュ）", "今の場所：pwd ／ pwd　　移動：cd ／ cd　　一覧：ls ／ ls -la（隠しファイルも）", "コピー：Copy-Item 元 先 -Force ／ cp 元 先　　移動：Move-Item ／ mv", "削除：Remove-Item ／ rm（Macはごみ箱に入らない。rm -i で確認つき）", "中身を見る：Get-Content ／ cat　　先頭だけ：Select-Object -First 20 ／ head -20", "文字を探す：Select-String ／ grep -n　　フォルダ全体：grep -rn \"文字\" .", "クリップボード：Set-Clipboard / Get-Clipboard ／ pbcopy / pbpaste", "今の場所を開く：explorer . ／ open .", "変数：$name = \"x\" ／ name=\"x\"（= の前後に空白を入れない）。使う時は両方 $name", "直前の結果：$LASTEXITCODE ／ $?（0なら成功）", "出力を捨てる：*> $null ／ >/dev/null 2>&1", "画面クリア：cls ／ clear　　中断：Ctrl+C（どちらも同じ）"], "ask": "", "code": "# Windows(PowerShell)                       # Mac(ターミナル)\ncd \"$env:USERPROFILE\\Downloads\"             cd ~/Downloads\nCopy-Item a.html b.html -Force              cp a.html b.html\nSelect-String -Path a.html -Pattern \"x\"     grep -n \"x\" a.html\nGet-Content a.html -Raw | Set-Clipboard     pbcopy < a.html\nexplorer .                                  open .", "tags": "mac windows 対応 違い コマンド 対応表 powershell zsh ターミナル", "note": ""}, {"id": "x2", "dom": "mac", "t": "Windows と Mac の「しくみ」の違い", "when": "同じことをしているのに、MacBook Proでは動かない／表示が違う", "do": ["シェル：Windowsは PowerShell（オブジェクトを流す）／ Macは zsh（文字を流す）。同じ名前の別物", "スクリプト：.ps1（実行ポリシーが必要）／ .sh か関数を ~/.zshrc に書く（chmod +x で実行可能に）", "設定ファイル：$PROFILE ／ ~/.zshrc", "インストール：winget ／ Homebrew（brew install）。Apple Silicon の Homebrew は /opt/homebrew に入る", "文字コード：Windows PowerShell 5.1 は BOM付きUTF-8に注意 ／ Macは基本UTF-8で問題なし", "改行：Windowsは CRLF、Macは LF。gitが吸収する。「LF will be replaced by CRLF」の警告は失敗ではない", "ダウンロードの重複名：ブラウザにより「名前 (1).html」「名前 2.html」。名前の崩れは同じように起きる", "ファイル名の大文字小文字：どちらも既定では区別しない。GitHub（Linux）は区別するので、大文字小文字を統一する", "git・gh・wrangler：どちらでも同じコマンドが使える（ここが共通の土台）", "iCloud Drive の場所：Macは ~/Library/Mobile Documents/com~apple~CloudDocs"], "ask": "", "code": "", "tags": "mac windows 違い しくみ zsh powershell 改行 crlf lf bom", "note": ""}, {"id": "x3", "dom": "mac", "t": "MacBook Proの初期セットアップ（1回だけ）", "when": "新しいMacBook Proで、git・GitHub・Workerの作業をできるようにしたい", "do": ["xcode-select --install：開発の基本道具（gitを含む）を入れる。画面の案内に従う", "Homebrew を入れる：下のコマンド。最後に出る「Next steps」（PATHの設定）を、表示どおりに実行する", "brew install git gh node：git・GitHubのコマンド・Node.js（wranglerに必要）", "gh auth login：画面の案内でGitHubにログイン（Windowsと同じアカウント）", "git config：user.name は GitHub名（norinori-jan）。user.email は、Windowsで git config --global user.email を実行して出た値と同じにする", "wrangler：npm install -g wrangler（brewで入れたNodeなら sudo 不要）→ wrangler login"], "ask": "", "code": "xcode-select --install\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\nbrew install git gh node\ngh auth login\ngit config --global user.name \"norinori-jan\"\nnpm install -g wrangler\nwrangler login", "tags": "mac セットアップ brew homebrew 初期 インストール macbook", "note": "Homebrewのインストールコマンドは公式の方式。実行前に最新の手順を brew.sh で確認する"}, {"id": "x4", "dom": "mac", "t": "Mac用 ship（ダウンロード→GitHubまで1コマンド）", "when": "MacBook Proで、Windowsの Ship と同じように公開したい", "do": ["Windows版と同じ動き：ダウンロード・デスクトップ・iCloud Driveから、名前の崩れや -r2 -r3 も含めて探す", "番号（-r の数字）が大きい方を優先し、同じ番号なら新しい方を使う", "フォルダ（~/アプリ名）・リポジトリが無ければ作り、コピー→commit→push→Pages設定まで行う", "使い方：ship アプリ名 ファイル1 ファイル2 …（Windowsと違い、@( ) や , は使わない）", "まとめて公開は shipall（最近3日以内に届いた全アプリを自動検出）。指定は shipall アプリ1 アプリ2", "一度貼れば、そのターミナルで有効。毎回貼りたくない時は、次のカード（.zshrc）へ", "bash では動作確認済み。Macの標準シェルは zsh。動かなければ、画面の表示を貼る"], "ask": "", "code": "ship() {\n  local name=\"$1\"; shift\n  local files=(\"$@\")\n  local user=\"norinori-jan\"\n  local dest=\"$HOME/$name\"\n  local stage; stage=$(mktemp -d)\n  local dirs=(\"$HOME/Downloads\" \"$HOME/Desktop\" \"$HOME/Library/Mobile Documents/com~apple~CloudDocs\")\n  local lname; lname=$(printf '%s' \"$name\" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')\n  echo \"=== $name ===\"\n  local f base ext extre d p n rev mt best\n  for f in \"${files[@]}\"; do\n    base=\"${f%.*}\"; ext=\".${f##*.}\"\n    base=$(printf '%s' \"$base\" | tr '[:upper:]' '[:lower:]')\n    extre=$(printf '%s' \"$ext\" | tr '[:upper:]' '[:lower:]' | sed 's/\\./\\\\./g')\n    best=$(\n      for d in \"${dirs[@]}\"; do\n        [ -d \"$d\" ] || continue\n        find \"$d\" -maxdepth 2 -type f 2>/dev/null | while IFS= read -r p; do\n          n=$(basename \"$p\" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')\n          if printf '%s' \"$n\" | grep -Eq \"^${lname}(-r[0-9]+)?_*${base}.*${extre}(\\\\.txt)?\\$\"; then\n            rev=$(printf '%s' \"$n\" | sed -nE \"s/^${lname}-r([0-9]+).*/\\\\1/p\"); rev=${rev:-0}\n            mt=$(stat -c %Y \"$p\" 2>/dev/null || stat -f %m \"$p\")\n            printf '%s\\t%s\\t%s\\n' \"$rev\" \"$mt\" \"$p\"\n          fi\n        done\n      done | sort -t \"$(printf '\\t')\" -k1,1nr -k2,2nr | head -1 | cut -f3-\n    )\n    if [ -z \"$best\" ]; then echo \"NG: ${name}__$f が見つかりません（探した場所: ダウンロード・デスクトップ・iCloud Drive）\"; rm -rf \"$stage\"; return 1; fi\n    echo \"  見つけた: $best\"\n    cp \"$best\" \"$stage/$f\"\n  done\n  local exists=0\n  gh repo view \"$user/$name\" >/dev/null 2>&1 && exists=1\n  mkdir -p \"$dest\"; cd \"$dest\" || return 1\n  if [ ! -d .git ]; then\n    git init -q; git branch -M main\n    if [ \"$exists\" = 1 ]; then git remote add origin \"https://github.com/$user/$name.git\"; git fetch origin; git reset origin/main; git checkout -- .; fi\n  elif [ \"$exists\" = 1 ]; then git pull --rebase; fi\n  for f in \"${files[@]}\"; do cp \"$stage/$f\" \"$dest/$f\"; done\n  rm -rf \"$stage\"\n  git add \"${files[@]}\"\n  if git diff --cached --quiet; then echo \"$name : 変更なし（すでに反映済み）\"; return 0; fi\n  git commit -q -m \"update $name\"\n  if [ \"$exists\" = 0 ]; then gh repo create \"$user/$name\" --public --source . --remote origin; fi\n  local br; br=$(git rev-parse --abbrev-ref HEAD)\n  git push -u origin \"$br\" || { echo \"NG: $name の push に失敗しました（ブランチ: $br）\"; return 1; }\n  gh api \"repos/$user/$name/pages\" >/dev/null 2>&1 || gh api -X POST \"repos/$user/$name/pages\" -f \"source[branch]=$br\" -f \"source[path]=/\" >/dev/null 2>&1\n  echo \"完了: https://$user.github.io/$name/\"\n}\n\nshipall() {\n  local d p n a l f ok=\"\" ng=\"\"\n  local dirs=(\"$HOME/Downloads\" \"$HOME/Desktop\" \"$HOME/Library/Mobile Documents/com~apple~CloudDocs\")\n  local mt=(-mtime -3)\n  [ \"$#\" -gt 0 ] && mt=(-mtime -36500)\n  local pairs apps\n  pairs=$(for d in \"${dirs[@]}\"; do [ -d \"$d\" ] || continue; find \"$d\" -maxdepth 2 -type f \"${mt[@]}\" 2>/dev/null; done | while IFS= read -r p; do\n    n=$(basename \"$p\" | tr '[:upper:]' '[:lower:]')\n    printf '%s\\n' \"$n\" | sed -nE 's/^([a-z0-9][a-z0-9-]*)[_[:space:]]+(index|manifest|icon|sw)([[:space:]]*\\([0-9]+\\)|[[:space:]]+[0-9]+)?\\.(html|webmanifest|svg|js)(\\.txt)?$/\\1 \\2 \\4/p'\n  done | sed -E 's/^(.*)-r[0-9]+ /\\1 /' | awk '($2==\"index\"&&$3==\"html\")||($2==\"manifest\"&&$3==\"webmanifest\")||($2==\"icon\"&&$3==\"svg\")||($2==\"sw\"&&$3==\"js\"){print $1, $2\".\"$3}' | sort -u)\n  if [ \"$#\" -gt 0 ]; then apps=$(printf '%s\\n' \"$@\" | tr '[:upper:]' '[:lower:]'); else apps=$(printf '%s\\n' \"$pairs\" | awk 'NF{print $1}' | sort -u); fi\n  if [ -z \"$apps\" ]; then echo \"公開待ちのファイルがありません（最近3日以内に届いた「アプリ名__index.html」の形のもの）\"; return 1; fi\n  echo \"まとめて公開: $(printf '%s\\n' \"$apps\" | paste -sd' ' -)\"\n  while IFS= read -r a; do\n    local files=()\n    while IFS= read -r l; do [ -n \"$l\" ] && files+=(\"$l\"); done  "関数を書く時に、どの書き方を使えばいいか迷う", "do": ["① function 名前(引数) { … }：基本。名前が付くので読みやすい（最初はこれ）", "② const 名前 = (引数) => 式：アロー関数。短い関数、配列の map/filter 向き", "③ 引数の初期値：(name = 'あなた')。渡されなかった時の代わりの値", "④ オブジェクトで受ける：({ yen, qty = 1 })。項目名が見えて、順番を間違えない。引数が3つ以上ならこれ", "⑤ 複数を返す：配列かオブジェクトで返す。[前, 後] / { ok, value }"], "ask": "関数は、引数が3つ以上ならオブジェクトで受け取る。戻り値の形は、成功でも失敗でも同じにする。", "code": "function area(w, h) { return w * h }                    // ① 関数\nconst area2 = (w, h) => w * h                           // ② アロー関数\nconst greet = (name = 'あなた') => 'こんにちは、' + name     // ③ 初期値\nconst price = ({ yen, qty = 1 }) => yen * qty            // ④ オブジェクトで受ける\nconst split = s => { const i = s.indexOf(':'); return [s.slice(0, i), s.slice(i + 1)] }   // ⑤ 複数を返す\n// 使い方\nprice({ yen: 300, qty: 2 })   // 600\nsplit('a:b:c')                // ['a', 'b:c']", "tags": "関数 書き方 アロー 引数 初期値 オブジェクト 戻り値", "note": "", "lv": 3}, {"id": "f3", "dom": "fn", "t": "良い関数の条件：小さく・1つの仕事・動詞の名前", "when": "関数が長くなって、どこを直せばいいかわからない", "do": ["1つの関数は1つの仕事。「〜して、〜して、〜する」と説明が長くなったら分ける", "名前は動詞から：get / set / parse（読む）/ to（変換）/ is（はい/いいえ）/ render（描く）/ save / load", "長くなったら：①コメントで区切る ②まとまりに名前を付ける ③関数に切り出す ④元の場所で呼ぶ ⑤動かして確認", "切り出した関数は、あとで他のアプリでも使える（自分の関数箱になる）"], "ask": "1つの関数は1つの仕事にする。計算・保存・画面描画を別の関数に分け、名前は動詞で付ける。", "code": "// ✗ 何でも屋（計算も保存も画面も）\nfunction doIt(){ const v=parseFloat(el.value); total+=v; localStorage.setItem('t',total); view.textContent=total }\n\n// ○ 1つの仕事ずつ\nconst readAmount = s => parseFloat(s)                 // 読む\nconst addTo = (total, v) => total + v                 // 計算だけ（外に影響しない）\nconst saveTotal = t => store.set('t', t)              // 保存だけ\nconst drawTotal = t => { view.textContent = t }       // 画面だけ\nfunction onAdd(){ total = addTo(total, readAmount(el.value)); saveTotal(total); drawTotal(total) }", "tags": "関数 分ける 名前 長い 小さく 単一責任 リファクタ", "note": "", "lv": 3}, {"id": "f4", "dom": "fn", "t": "計算と、保存・画面を分ける（純粋な関数）", "when": "テストしやすく、AIにも頼みやすい関数にしたい", "do": ["計算の関数：同じ入力なら必ず同じ出力。画面・保存・通信に触らない（純粋な関数）", "副作用の関数：保存する、画面を書き換える、通信する。数を少なく、1か所にまとめる", "計算の関数は、画面が無くても例だけで確かめられる（ドリルと同じ）", "「入力 → 計算 → 描画」の3段にすると、どこが悪いか一発でわかる"], "ask": "データ処理は、画面や保存に触らない関数にする。描画は、その結果を受け取って表示するだけの関数にする。", "code": "// 計算（純粋）：画面にも保存にも触らない\nconst groupSum = (rows, key, val) =>\n  rows.reduce((m, r) => (m[r[key]] = (m[r[key]] || 0) + r[val], m), {})\n\n// 描画：結果を受け取って表示するだけ\nconst draw = data => { box.innerHTML = Object.entries(data).map(([k, v]) => `<div>${esc(k)}：${v}<\/div>`).join('') }\n\n// つなぐ\ndraw(groupSum(rows, 'カテゴリ', '金額'))", "tags": "純粋 計算 副作用 描画 テスト 分離", "note": "実例：table-pad のダッシュボード", "lv": 3}, {"id": "f5", "dom": "fn", "t": "失敗しても落ちない戻り値の設計", "when": "入力がおかしい時（空・文字・通信失敗）でも、アプリを止めたくない", "do": ["戻り値は、成功でも失敗でも「同じ形」にする。{ ok, value, error } が使いやすい", "または、読めなければ null を返す（呼ぶ側で null を確認する）", "例外（throw）は「想定外」だけに使う。普通の失敗は戻り値で返す", "どちらにするかを、関数の頭のコメントに1行書いておく"], "ask": "関数は、失敗しても例外で落とさず、{ok, value, error} か null の同じ形で返す。呼ぶ側は必ず結果を確認する。", "code": "function parseAmount(s) {                      // 失敗しても落ちない。常に {ok,...} を返す\n  const t = String(s).normalize('NFKC').replace(/[,\\s円¥]/g, '')\n  const neg = /^[△▲-]/.test(t)\n  const n = parseFloat(t.replace(/^[△▲-]/, ''))\n  if (isNaN(n)) return { ok: false, error: '数字として読めません' }\n  return { ok: true, value: neg ? -n : n }\n}\nconst r = parseAmount('△1,200')\nif (!r.ok) alert(r.error); else use(r.value)", "tags": "戻り値 失敗 null ok error 例外 設計", "note": "", "lv": 3}, {"id": "f6", "dom": "fn", "t": "ガード：早めに抜ける・?. ・??", "when": "undefined や null のせいで、画面が真っ白になる／エラーで止まる", "do": ["関数の頭で、おかしな入力を弾く（ガード）。弾いたらすぐ return で抜ける", "?. ：途中が無くても落ちない（data?.address?.city）", "?? ：null か undefined の時だけ、代わりの値を使う（0 や '' は残る。|| との違い）", "JSON.parse や fetch は、必ず try/catch で包む"], "ask": "関数の先頭で入力を確認し、おかしければ早めにreturnする。null/undefinedは?.と??で扱い、JSON.parseとfetchはtry/catchで包む。", "code": "function firstName(user) {\n  if (!user || typeof user.name !== 'string') return ''     // ガード：早めに抜ける\n  return user.name.split(' ')[0]\n}\nconst city = data?.address?.city ?? '不明'                  // 途中が無くても落ちない\nconst count = settings.count ?? 10                          // 0 はそのまま使う（|| だと10になる）\ntry { const d = JSON.parse(text) } catch (e) { showError('読み込めませんでした') }", "tags": "ガード null undefined try catch 落ちる 真っ白 エラー", "note": "", "lv": 3}, {"id": "f7", "dom": "fn", "t": "配列の3関数：filter / map / reduce（アプリの8割）", "when": "一覧を絞り込む・変換する・合計する、といった処理をしたい", "do": ["filter：条件に合うものだけ残す（絞り込み・検索）", "map：1件ずつ変換して、新しい配列にする（表示用に変える・項目を取り出す）", "reduce：1つの値にまとめる（合計・カテゴリ別集計・オブジェクト化）", "[...new Set(配列)]：重複を除いた種類の一覧", "sort は元の配列を変えてしまう。[...rows].sort(…) とコピーしてから並べる", "行の先頭が [ や ( の時は、前の行の終わりに ; を付ける（付けないと前の行とつながって、構文エラーになる）", "これを組み合わせれば、表・ダッシュボード・検索の大半は書ける"], "ask": "一覧の処理は、filter・map・reduceの組み合わせで書く。sortは元の配列を変えないようコピーしてから使う。", "code": "const rows = [{c:'食費',y:1200},{c:'交通',y:300},{c:'食費',y:800}];\nrows.filter(r => r.c === '食費');                 // 絞り込む → 2件\nrows.map(r => r.y);                              // 取り出す → [1200,300,800]\nrows.reduce((s, r) => s + r.y, 0);               // 合計 → 2300\n[...new Set(rows.map(r => r.c))];                // 種類 → ['食費','交通']\n[...rows].sort((a, b) => b.y - a.y);             // 並べ替え（コピーしてから）\nrows.reduce((m, r) => (m[r.c] = (m[r.c] || 0) + r.y, m), {});   // カテゴリ別 → {食費:2000,交通:300}\n// 注意：行の先頭が [ や ( の時は、前の行の終わりに ; が必要（無いと前の行とつながって構文エラー）", "tags": "配列 map filter reduce 集計 絞り込み 合計 sort set", "note": "実例：groupSum はこの形", "lv": 3}, {"id": "f8", "dom": "fn", "t": "ボタンと関数をつなぐ（イベント）", "when": "ボタンを押したら、この関数を動かしたい", "do": ["button.onclick = () => 関数(…)：押された時にだけ動く。関数を「渡す」だけで、呼ばない（括弧を付けると、その場で動いてしまう）", "一覧の中のボタンは、一覧全体で受ける（イベント委譲）。e.target.closest('[data-id]') で、どの行かを調べる", "入力の度に動かすと重い時は、debounce（少し待ってから1回だけ動かす）", "ボタン→関数→状態を変える→画面を作り直す、の流れを守る"], "ask": "ボタンのイベントは関数を渡して設定する。一覧のボタンは親要素でまとめて受け、data-idでどの行かを判定する。", "code": "btn.onclick = () => addItem(input.value)                 // ○ 関数を渡す（押した時に動く）\n// btn.onclick = addItem(input.value)                    // ✗ その場で動いてしまう\n\nlist.onclick = e => {                                    // 一覧全体で受ける\n  const b = e.target.closest('[data-id]'); if (!b) return\n  removeItem(b.dataset.id)\n}\nfunction debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }\ninput.oninput = debounce(() => search(input.value), 200)", "tags": "イベント onclick ボタン 関数 debounce 委譲 data-id", "note": "", "lv": 3}, {"id": "f9", "dom": "fn", "t": "待つ関数：async / await", "when": "通信（AI・Worker・fetch）の結果を待ってから、次の処理をしたい", "do": ["async を付けた関数は、中で await が使える。await は結果が来るまで待つ", "await する処理は、必ず try/catch で包む（失敗した時の受け皿）", "fetch は、失敗しても例外にならない。r.ok を確認して、自分で throw する", "待っている間は、ボタンを無効化して「実行中…」を出す（二重押し防止）", "時間切れは AbortController で打ち切る（AI連携は45秒など）"], "ask": "通信は async/await で書き、try/catchで包む。fetchは r.ok を確認し、待っている間はボタンを無効化して実行中と表示する。", "code": "async function loadJSON(url) {\n  const r = await fetch(url)                          // 待つ\n  if (!r.ok) throw new Error('取得失敗 ' + r.status)  // fetchは404でも例外にならない\n  return r.json()\n}\nasync function onLoad() {\n  btn.disabled = true; msg.textContent = '実行中…'\n  try { draw(await loadJSON('data.json')); msg.textContent = '' }\n  catch (e) { msg.textContent = '失敗：' + e.message }\n  finally { btn.disabled = false }\n}", "tags": "async await 通信 fetch 待つ 非同期 try finally", "note": "実例：ear-first の AI生成", "lv": 4}, {"id": "f10", "dom": "fn", "t": "アプリの骨格：状態 → 計算 → 描画", "when": "新しいアプリの、関数の組み立て方（設計図）が知りたい", "do": ["状態 S：アプリが覚えているデータを1つのオブジェクトにまとめる", "setState(変更)：状態を変える唯一の入口。変更 → 保存 → 描画をここで必ず行う", "計算の関数：状態から、画面に出す値を作る（絞り込み・合計など）", "render()：状態を見て、画面全体を作り直す。部品ごとの更新より簡単で、ずれない", "イベント：ボタン → setState() だけを呼ぶ。この骨格は、私のアプリ（ai-dojo・code-ref）と同じ"], "ask": "状態Sを1つのオブジェクトで持ち、変更はsetStateだけで行う（変更→保存→render）。計算の関数は別に分け、renderは表示だけにする。", "code": "let S = { items: [], filter: '' }\nconst setState = patch => { S = { ...S, ...patch }; save(); render() }   // 変更は必ずここを通す\nconst visible = S => S.items.filter(i => i.t.includes(S.filter))          // 計算\nfunction render() {                                                       // 描画だけ\n  app.innerHTML = visible(S).map(i => `<li>${esc(i.t)}<\/li>`).join('')\n}\nadd.onclick = () => setState({ items: [...S.items, { t: input.value }] })\nsearch.oninput = e => setState({ filter: e.target.value })", "tags": "状態 state render 設計 骨格 setState アプリ 組み立て", "note": "実例：ai-dojo / code-ref", "lv": 3}, {"id": "f11", "dom": "fn", "t": "関数をAIに頼む：仕様は「例」で", "when": "AIに関数を作らせたい。期待どおりに作ってもらいたい", "do": ["入力 → 出力の例を3つ以上。普通の例＋境界の例（空・おかしな入力・極端な値）", "関数名・引数・戻り値の形を決めて書く（名前を指定すると、そのまま使える）", "条件を書く：保存や画面には触らない／関数1つだけ返す／説明は1行", "例は、そのままテストになる。受け取ったら、例どおりに動くか確かめる", "直してもらう時は、失敗した例（入力・期待・実際）と、変えてよい範囲を渡す"], "ask": "関数 toNumber(s) をJavaScriptで作る。例：'△1,200'→-1200、'(500)'→-500、'1,234円'→1234、'abc'→null、''→null。保存や画面には触らない。関数1つだけ返して。", "code": "// 頼む文のひな形\n関数 名前(引数) をJavaScriptで作る。\n例：\n入力A → 出力A\n入力B → 出力B\n境界：空 → ?   おかしな値 → ?\n条件：保存や画面には触らない。関数1つだけ返して。\n\n// 直してもらう文のひな形\n名前(入力) が 実際 になる。期待は 期待。\n直す範囲は 名前 だけ。他は変えない。", "tags": "関数 頼む 仕様 例 テスト ai プロンプト 境界", "note": ""}, {"id": "f12", "dom": "fn", "t": "関数を確かめる（小さなテスト）", "when": "作ってもらった関数が、本当に正しく動くか確かめたい", "do": ["例（入力と期待）を表にして、関数に通し、期待と同じか比べる", "境界の例（空・0・全角・長い・おかしな文字）を必ず入れる", "iPhoneにはコンソールが無い。結果は画面（<pre>）に出す", "ai-dojo の関数ドリルが、この仕組み（例で自動採点）をそのまま使っている", "直したら、前に通っていた例も全部もう一度通す（壊していないか）"], "ask": "関数には、入力→期待の例をテスト表として付ける。実行して全部通ることを確認してから使う。", "code": "function check(name, got, want) {\n  const a = JSON.stringify(got), b = JSON.stringify(want), ok = a === b\n  return (ok ? '✅ ' : '❌ ') + name + (ok ? '' : '  結果=' + a + '  期待=' + b)\n}\nconst lines = [\n  check('△', toNumber('△1,200'), -1200),\n  check('括弧', toNumber('(500)'), -500),\n  check('空', toNumber(''), null),\n]\nout.textContent = lines.join('\\n')        // iPhoneでも見える（<pre id=\"out\">）", "tags": "テスト 確かめる 例 期待 check 動作確認 ドリル", "note": "実例：ai-dojo の関数ドリル"}, {"id": "f13", "dom": "fn", "t": "自分の関数箱を作る（使い回す部品）", "when": "同じ関数を、アプリごとに書き直したくない", "do": ["どのアプリでも使う関数は、同じ形で持っておく：esc（安全な文字化）・store（安全な保存）・copy・num・decodeBuf・genPw など", "code-ref の「自分」タブに、動いた関数をカードとして貯める（コードも一緒に）", "新しいアプリを頼む時は、「組む」で、使う関数カードを入れて、コードごと渡す", "AIに「この関数をそのまま使って」と渡すと、アプリ間で動きが揃う", "修正したら、元のカードも直す（古い版が増えないように）"], "ask": "次の関数は、そのまま使ってよい（コードを貼る）。新しく作る関数は、これと同じ書き方・命名にする。", "code": "", "tags": "関数箱 使い回し 共通 部品 ライブラリ 再利用 自分", "note": "考え方：sharedな関数を1か所にまとめる＝shared-core と同じ発想"}, {"id": "f14", "dom": "fn", "t": "関数ドリルで鍛える（ai-dojo）", "when": "読むだけでなく、手を動かして、関数が書けるようになりたい", "do": ["ai-dojo の「練習」タブ → 関数ドリル。13問、難しさは少しずつ上がる", "題材は、あなたのアプリで実際に使う関数（金額・和暦・集計・秘密の伏せ字・JSON取り出し・版の選択・検索で絞る・暗号文字列の分解・AI返事の検証・復習日・2台の合体）", "コードを書いて「実行」すると、例で自動採点。ヒントと解答例もある", "全問正解のたびに記録に残る。解答例と比べて、書き方の違いをメモにする", "慣れたら、自分の関数を AI に例つきで頼み、同じ形で確かめる"], "ask": "", "code": "", "tags": "ドリル 練習 ai-dojo 関数 例題 鍛える", "note": "実例：ai-dojo"}, {"id": "f15", "dom": "fn", "t": "現場の関数5選（絞る・分解・検証・日付・合体）", "when": "アプリでよく出る処理を、そのまま使える関数で持っておきたい", "do": ["絞る：filterBy(rows, q) 検索ボックスの基本。空なら全部、前後の空白と大文字小文字は無視", "分解：parseBlob(s) 暗号化した文字列は、形の検査だけを関数にする（鍵は扱わない）", "検証：checkReply(text) AIの返事は、{ } を取り出し、形を確かめてから使う。だめなら null", "日付：nextDue(last, level) 日付計算は UTC で行うと、時差でずれない", "合体：mergeByUpdated(a, b) 同じ id は updated が新しい方を残す。2台のデータの基本", "どれも「入力 → 計算 → 戻り値」だけ。保存や画面は別の関数にする（f4）"], "ask": "関数は、入力と戻り値だけの小さな部品として書く。AIの返事は形を検証してから使い、日付は UTC で計算し、同期は updated の新しい方を残す。", "code": "function filterBy(rows, q) {\n  const k = q.trim().toLowerCase();\n  if (!k) return rows;\n  return rows.filter(r => (r.name + \" \" + r.tag).toLowerCase().includes(k));\n}\n\nfunction parseBlob(s) {\n  const p = String(s).split(\":\");\n  if (p.length !== 3 || p[0] !== \"v1\") return null;\n  return { v: p[0], iv: p[1], ct: p[2] };\n}\n\nfunction checkReply(text) {\n  const a = text.indexOf(\"{\"), b = text.lastIndexOf(\"}\");\n  if (a < 0 || b < a) return null;\n  let o;\n  try { o = JSON.parse(text.slice(a, b + 1)); } catch (e) { return null; }\n  if (!o || typeof o.title !== \"string\" || !Array.isArray(o.items)) return null;\n  if (!o.items.every(x => typeof x === \"string\")) return null;\n  return o;\n}\n\nfunction nextDue(last, level) {\n  const days = [1, 3, 7, 14, 30];\n  const n = days[Math.min(level, const KIND_INFO={'関数':'処理に名前を付けて登録する。呼ばれるまで動かない','アロー関数':'短く書く関数（=>）。引数として渡されることが多い','クラス':'同じ形のもの（データ＋動き）を作る設計図','条件':'条件が成り立つ時だけ中を実行する','繰り返し':'中の処理を何度も繰り返す','分岐':'値によって行き先を切り替える','失敗に備える':'try の中で失敗したら catch に移る（落ちないための受け皿）','メソッド':'オブジェクトやクラスに属する関数','データ':'項目のまとまり（オブジェクト）','ブロック':'処理のまとまり'};
const FEAT=[
 [/\bawait\b|\basync\b/,'待つ（async/await）','f9'],[/\bfetch\s*\(/,'通信（fetch）','a1'],[/\blocalStorage\b/,'端末に保存（localStorage）','d1'],[/\bindexedDB\b/,'大きく保存（IndexedDB）','d3'],

function parseCode(src){

    o.push(L.slice(pos).replace(/[^\n]/g,' '));L=o.join('')}
  const n=L.length,ps=!/\bconst\b|\blet\b|=>/.test(L)&&/(^|\n)\s*(function\s+[\w-]+\s*\{|\$\w+\s*=|param\s*\()/.test(L);
  const clean=L.split('');let i=0,line=1,hs=0,pd=0,ph='';const st=[],blocks=[],errs=[];
  const blank=(a,b)=>{for(let k=a;k<b;k++)if(clean[k]!=='\n')clean[k]=' '};
  const skipBr=(k)=>{let d=1;k+=2;while(k<n&&d>0){if(L[k]==='{')d++;else if(L[k]==='}')d--;else if(L[k]==='\n')line++;k++}return k};

    if(c==='\n'){line++;if(ps&&pd===0){const t=clean.slice(hs,i).join('').trim();if(t)ph=t;hs=i+1}i++;continue}
    if((c==='/'&&d==='/')||(ps&&c==='#')){const e=L.indexOf('\n',i);const j=e<0?n:e;blank(i,j);i=j;continue}
    if(c==='/'&&d==='*'||(ps&&c==='<'&&d==='#')){const cl=ps&&c==='<'?'#>':'*/';let e=L.indexOf(cl,i+2);e=e<0?n:e+2;for(let k=i;k<e;k++)if(L[k]==='\n')line++;blank(i,e);i=e;continue}
    if(c==='"'||c==="'"||c==='`'){let k=i+1;
      while(k<n){const x=L[k];
        if(x==='\n'){line++;if(c!=='`'&&!ps&&L[k-1]!=='\\')break}
        if(c==='`'&&!ps&&x==='$'&&L[k+1]==='{'){k=skipBr(k)-1}
        else if(!ps&&x==='\\'){k++}
        else if(ps&&x==='`'&&c==='"'){k++}
        else if(x===c){if(ps&&L[k+1]===c){k++}else break}
        k++}

    if(c==='('){pd++}else if(c===')'){pd=Math.max(0,pd-1)}
    else if(c===';'&&pd===0){hs=i+1;ph=''}

    else if(c==='}'){const t=st.pop();if(!t){errs.push('行'+line+'：閉じる } に対応する { がありません')}else{blocks.push(Object.assign(classify(t.head,ps),{start:t.line,end:line,depth:t.depth,head:t.head.replace(/\s+/g,' ').trim()}))}hs=i+1;pd=0}
    i++}
  st.forEach(t=>errs.push('行'+t.line+'：開いた { が閉じられていません'));
  blocks.sort((a,b)=>a.start-b.start||b.end-a.end);
  const feats=FEAT.filter(f=>f[0].test(clean.join(''))).map(f=>({t:f[1],id:f[2]}));
  return{blocks,errs,lines:L.split('\n').length,feats}}
function classify(head,ps){
  const h=head.replace(/\s+/g,' ').trim(); let m;
  if((m=/(?:^|[\s=:(,])function\b\s*\*?\s*([\w$-]*)/.exec(h)))return{kind:'関数',name:m[1]||'（名前なし）'};
  if((m=/\bclass\s+([\w$]+)/.exec(h)))return{kind:'クラス',name:m[1]};
  if(/=>\s*$/.test(h)){let nm='';if((m=/(?:const|let|var)\s+([\w$]+)\s*=/.exec(h)))nm=m[1];else if((m=/([\w$]+)\s*[:=]\s*(?:async\s*)?(?:\(|[\w$]+\s*=>)/.exec(h)))nm=m[1];else if((m=/([\w$.]+)\s*\([^()]*$/.exec(h)))nm=m[1]+' に渡す';return{kind:'アロー関数',name:nm||'（名前なし）'}}
  if(/^(else\s+if|elseif|if)\b/i.test(h))return{kind:'条件',name:h.replace(/^(else\s+if|elseif|if)\s*/i,'$&').slice(0,40)};
  if(/^else\b/i.test(h))return{kind:'条件',name:'それ以外'};
  if(/Where-Object/i.test(h))return{kind:'条件',name:'Where-Object（絞る）'};
  if(/ForEach-Object/i.test(h))return{kind:'繰り返し',name:'ForEach-Object'};
  if(/^(for|foreach|while|do)\b/i.test(h))return{kind:'繰り返し',name:h.slice(0,40)};
  if(/^switch\b/i.test(h))return{kind:'分岐',name:h.slice(0,40)};
  if(/^(try|catch|finally)\b/i.test(h))return{kind:'失敗に備える',name:h.split(/[\s(]/)[0]};
  if((m=/^(?:async\s+)?([\w$]+)\s*\([^()]*\)$/.exec(h))&&!/^(if|for|while|switch|catch|function|return)$/.test(m[1]))return{kind:'メソッド',name:m[1]};
  if(/(=|:|\(|,|@|\breturn|\[)\s*$/.test(h)||h==='')return{kind:'データ',name:h?h.replace(/[=:(,\[]\s*$/,'').trim().slice(0,30):''};
  return{kind:'ブロック',name:h.slice(0,30)}}

  <h2>③ アプリの部品</h2>`+MAPD.map(g=>`<div class="card"><b>${g[0]} ${esc(g[1])}</b><div class="row" style="margin-top:8px">${g[2].map(x=>`<button class="chip" data-go="${esc(x[1])}">${esc(x[0])}</button>`).join('')}</div></div>`).join('')
  +`<h2>④ 6段のはしご（下から順に）</h2><div class="card">`+LADDER.slice().reverse().map(l=>`<div style="margin:6px 0"><span class="tag lv">L${l[0]}</span><b style="font-size:14px">${esc(l[1])}</b><div class="row" style="margin-top:4px">${l[2].map(i=>{const c=byId(i);return c?`<button class="chip" data-go="${esc(i)}">${esc(c.t)}</button>`:''}).join('')}</div></div>`).join('')+`</div>
  <div class="card"><b>⑤ 自分のアプリから見る</b><div class="note">どのアプリが何を使っているかは「📱 アプリ」へ。</div><div class="row" style="margin-top:8px"><button class="chip" data-tab="apps">📱 アプリを開く</button></div></div>`;
  $('#app').onclick=e=>{const g=e.target.closest('[data-go]'),d=e.target.closest('[data-dom]'),t=e.target.closest('[data-tab]');
    if(g)goCard(g.dataset.go);else if(d){tab='find';q='';dom=d.dataset.dom;openId=null;render();scrollTo(0,0)}else if(t){tab=t.dataset.tab;render();scrollTo(0,0)}}}

// ---------- アプリ地図 ----------
function rApps(){
  $('#app').innerHTML=`<h1>アプリ</h1><p class="sub">今まで作ったアプリと、その中で使っている型。「この型で新しく作る」で、同じ作りのカードを一括で 組む に入れます。</p>`
  +APPS.map(a=>`<div class="card" data-id="${esc(a.id)}"><b>${esc(a.t)}</b><div class="when">${esc(a.d)}</div>
   <div class="note">使っている分野：${[...new Set(a.cards.map(id=>{const c=byId(id);return c?domName(c.dom):''}).filter(Boolean))].map(esc).join('、')}</div>
   <div class="row" style="margin:8px 0 6px">${a.cards.map(id=>{const c=byId(id);return c?`<button class="chip" data-go="${esc(id)}">${esc(c.t)}</button>`:''}).join('')}</div>
   <div class="row"><button class="s" data-add="${esc(a.id)}">🧩 この型で新しく作る</button><a href="https://norinori-jan.github.io/${esc(a.id)}/" target="_blank" rel="noopener" style="font-size:13px">開く ↗</a></div></div>`).join('');
  $('#app').onclick=e=>{const g=e.target.closest('[data-go]'),ad=e.target.closest('[data-add]');
    if(g){goCard(g.dataset.go)}
    else if(ad){const a=APPS.find(x=>x.id===ad.dataset.add);a.cards.forEach(id=>{if(!S.cart.includes(id))S.cart.push(id)});S.mk.ref=a.id;save();nav();toast(a.cards.length+'枚を 組む に入れました')}}}

// ---------- 組む ----------
const RULES=[
 ['single','HTML1ファイルで作る（外部ライブラリ・ビルドなし）','HTML1ファイルで、外部ライブラリやビルド手順は使わない。'],
 ['iphone','iPhoneで使う（押しやすさ・ホーム画面対応）','iPhoneで使う。ボタンは指で押しやすい大きさにし、ホーム画面に追加して動くPWA（manifest・アイコン・Service Worker付き）にする。'],
 ['local','データは端末内に保存','データは端末内にのみ保存し、勝手に外部へ送らない。'],
 ['keep','既存データ・機能を壊さない','既存のデータ形式と既存機能は変えない。'],
 ['names','配布名は アプリ名__ファイル名','配布ファイルは「アプリ名__ファイル名」の名前で出す。'],
 ['steps','小さく作り、確認手順つき','まず骨組みだけ作り、動作確認の手順を添える。'],
 ['paste','コマンドはコピペで動く形','PowerShellのコマンドは、そのままコピペで動く形にする。説明文や<空欄>は入れない。'],
 ['secret','秘密は貼らない・入力欄で扱う','キーやトークンはコードに書かず、入力欄から自分で設定する設計にする。']
];
function buildPrompt(){
  const m=S.mk,on=m.rules||RULES.map(r=>r[0]);
  const L=['【目的】',(m.goal||'(何を実現したいか)').trim(),'','【アプリ名】',(m.app||'(アプリ名)').trim()];
  const cs=S.cart.map(byId).filter(Boolean);
  if(m.ref){const a=APPS.find(x=>x.id===m.ref);if(a)L.push('','【参考】',a.t+' と同じ作りを土台にする（'+a.d+'）')}
  if(cs.length){L.push('','【使う作り方（私のアプリで動作実績のある型）】');cs.forEach(c=>L.push('・'+c.t+(c.ask?'：'+c.ask:'')))}
  L.push('','【守るルール】');RULES.filter(r=>on.includes(r[0])).forEach(r=>L.push('・'+r[2]));
  L.push('','【出力形式】','・まず最初の段階（骨組み）だけ作る','・出来上がったファイルをダウンロードできる形で出す','・変更した点と確認手順を短く添える');
  if(m.code){const w=cs.filter(c=>c.code);if(w.length){L.push('','【参考コード（動作実績あり。そのまま流用してよい）】');w.forEach(c=>L.push('','// '+c.t,'```',c.code,'```'))}}
  return L.join('\n')}
function rBuild(){
  const m=S.mk,on=m.rules||RULES.map(r=>r[0]);
  $('#app').innerHTML=`<h1>組む</h1><p class="sub">選んだ型を組み合わせて、新しいアプリの依頼文を作ります。できた文章をAIに貼ってください。</p>
  <div class="card"><b>選んだ型（${S.cart.length}）</b><div id="cl"></div>
  ${S.cart.length?'<div class="row" style="margin-top:6px"><button class="s g" id="clr">すべて外す</button></div>':'<p class="note">「探す」や「アプリ」で 🧩 を押すと、ここに入ります。</p>'}</div>
  <div class="card"><p class="sub" style="margin:0 0 4px">アプリ名（英数字とハイフン）</p><input id="ap" value="${esc(m.app||'')}" placeholder="例：my-notes">
  <p class="sub" style="margin:10px 0 4px">目的（何を実現したい？）</p><textarea id="gl" placeholder="例：買い物メモを素早く残して、買ったら消せる">${esc(m.goal||'')}</textarea>
  <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--mu);font-size:13px">守るルール（あなたの流儀）</summary><div id="rl" style="margin-top:6px"></div></details>
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="wc" ${m.code?'checked':''}><span>参考コードも付ける（長くなる。AIが同じ書き方を再現しやすい）</span></label></div>
  <div class="row"><button id="mk">依頼文を作る</button><button class="g" id="cp">コピー</button></div><div id="msg" class="note"></div><pre id="out" style="white-space:pre-wrap;word-break:break-all" hidden></pre>`;
  $('#cl').innerHTML=S.cart.map(id=>{const c=byId(id);return c?`<div class="row" style="justify-content:space-between;margin:4px 0"><span style="font-size:14px"><span class="tag">${esc(domName(c.dom))}</span>${esc(c.t)}</span><button class="s g" data-rm="${esc(id)}">外す</button></div>`:''}).join('');
  $('#rl').innerHTML=RULES.map(r=>`<label class="chk"><input type="checkbox" data-k="${r[0]}" ${on.includes(r[0])?'checked':''}><span>${esc(r[1])}</span></label>`).join('');
  const pull=()=>{m.app=$('#ap').value;m.goal=$('#gl').value;m.code=$('#wc').checked;m.rules=[...$('#rl').querySelectorAll('input:checked')].map(x=>x.dataset.k);save()};
  ['ap','gl'].forEach(id=>$('#'+id).oninput=pull);$('#wc').onchange=pull;$('#rl').onchange=pull;
  $('#cl').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;S.cart=S.cart.filter(x=>x!==b.dataset.rm);save();rBuild();nav()};
  const clr=$('#clr');if(clr)clr.onclick=()=>{S.cart=[];S.mk.ref='';save();rBuild();nav()};
  let cur='';const gen=()=>{pull();if(!m.goal.trim()){$('#msg').textContent='目的を1行書いてください';return false}
    if(SECRET.test(m.goal)){$('#msg').textContent='キーらしい文字列があります。伏せてください';return false}
    cur=buildPrompt();$('#out').hidden=false;$('#out').textContent=cur;$('#msg').textContent=cur.length+'文字';return true};
  $('#mk').onclick=gen;$('#cp').onclick=()=>{if(gen())doCopy(cur)}}

// ---------- 自分 ----------
function rMine(){
  $('#app').innerHTML=`<h1>自分のカード</h1><p class="sub">うまくいった作り方や、失敗から学んだことを、自分のカードにして足していきます（メモではなく「次に使える型」として）。</p>
  <div class="card"><input id="t" placeholder="題名（例：日付の入力欄をiPhoneで使いやすく）"><div style="height:6px"></div>
  <input id="w" placeholder="こういう時（例：iPhoneで日付を選ばせたい）"><div style="height:6px"></div>
  <textarea id="d" placeholder="こうする（1行に1つ）"></textarea><div style="height:6px"></div>
  <textarea id="k" style="min-height:60px" placeholder="AIに頼む一文"></textarea><div style="height:6px"></div>
  <textarea id="c" style="min-height:60px" placeholder="動いたコード（任意）"></textarea>
  <div class="row" style="margin-top:8px"><button id="ad">カードを足す</button></div><div id="mm" class="note"></div></div>
  <div id="ml"></div>
  <div class="card"><b>バックアップ</b><p class="note">自分のカードを書き出す／貼り付けて読み込みます。</p><div class="row"><button class="s g" id="ex">書き出し（コピー）</button><button class="s g" id="im">読み込み（貼り付け）</button></div></div>`;
  const draw=()=>{$('#ml').innerHTML=S.mine.map(c=>`<div class="card"><span class="tag mine">自分</span><b>${esc(c.t)}</b><div class="when">${esc(c.when)}</div><div class="row" style="margin-top:6px"><button class="s g" data-del="${esc(c.id)}">削除</button></div></div>`).join('')};draw();
  $('#ml').onclick=e=>{const b=e.target.closest('[data-del]');if(!b||!confirm('削除しますか？'))return;S.mine=S.mine.filter(x=>x.id!==b.dataset.del);S.cart=S.cart.filter(x=>x!==b.dataset.del);save();draw();nav()};
  $('#ad').onclick=()=>{const t=$('#t').value.trim(),d=$('#d').value.trim().split(/\n+/).filter(Boolean);
    if(!t||!d.length){$('#mm').textContent='題名と「こうする」は必要です';return}
    const all4=t+$('#w').value+d.join('')+$('#k').value+$('#c').value;if(SECRET.test(all4)){$('#mm').textContent='キーらしい文字列があります。伏せてください';return}
    S.mine.unshift({id:'m'+Date.now(),t,when:$('#w').value.trim(),do:d,ask:$('#k').value.trim()||t,code:$('#c').value.replace(/\s+$/,''),tags:'',note:''});save();
    ['t','w','d','k','c'].forEach(i=>$('#'+i).value='');$('#mm').textContent='足しました（探すタブの「自分」に出ます）';draw()};
  $('#ex').onclick=()=>doCopy(JSON.stringify(S.mine,null,1));
  $('#im').onclick=()=>{const t=prompt('書き出した内容を貼り付けてください');if(!t)return;try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;
    const ids=new Set(S.mine.map(x=>x.id));a.filter(x=>x&&x.id&&x.t&&Array.isArray(x.do)&&!ids.has(x.id)).forEach(x=>S.mine.push(x));save();draw();toast('読み込みました')}catch(e){toast('読み込めませんでした')}};}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
